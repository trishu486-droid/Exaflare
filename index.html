<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>混沌の終末トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0b0a14;
  --ink:#f2ecff;
  --dim:#8c83a8;
  --edge:#3a3354;
  --btn:#1d1930;
  --gold:#ffcf4a;
  --red:#ff4d5e;
  --green:#58e07a;
  --px: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--px);padding-inline:16px;padding-block:12px 16px;display:flex;justify-content:center;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
.game{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font:400 16px/1.2 var(--px);letter-spacing:.06em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 b{color:var(--gold);font-weight:400}
.iconbtn{font:16px var(--px);color:var(--ink);background:var(--btn);border:2px solid var(--edge);width:38px;height:38px;border-radius:0;cursor:pointer;touch-action:manipulation}
.screen{position:relative;border:4px solid var(--edge);box-shadow:0 0 0 2px #000, 0 0 0 6px var(--edge);background:#000}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hud{position:absolute;inset:6px 8px auto 8px;display:flex;justify-content:space-between;pointer-events:none;font-size:clamp(12px,3.4vw,16px);text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
.hud .hit{color:var(--red)}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;text-shadow:3px 3px 0 #000;white-space:nowrap}
.msg .big{font-size:clamp(26px,9vw,44px);line-height:1.1}
.msg .sub{font-size:clamp(12px,3.4vw,15px);color:var(--ink);margin-top:6px}
.msg .blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.help{margin:0;text-align:center;color:var(--dim);font-size:13px}
.help kbd{font:13px var(--px);color:var(--ink);border:2px solid var(--edge);padding:0 5px;background:var(--btn)}
/* タッチ操作 */
.pad{display:none;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.touch .pad{display:flex}
.touch .help{display:none}
.stick{position:relative;width:132px;height:132px;flex:none;border:3px solid var(--edge);border-radius:50%;background:radial-gradient(circle,#1a1630 0 60%,#120f22 61%);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#3a3354;border:3px solid #6a5f94;box-shadow:inset -4px -4px 0 #2a2440}
.btns{display:grid;grid-template-columns:repeat(2,64px);gap:10px}
.pbtn{font:14px/1.1 var(--px);color:var(--ink);background:var(--btn);border:3px solid var(--edge);box-shadow:inset -3px -3px 0 #0f0d1b;height:56px;cursor:pointer;touch-action:manipulation}
.pbtn:active,.pbtn.on{background:#2c2548;border-color:var(--gold);color:var(--gold)}
.pbtn.go{border-color:var(--gold);color:var(--gold)}
/* 設定 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.panel{width:100%;max-width:380px;background:#131022;border:4px solid var(--edge);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:400 16px var(--px);color:var(--gold)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt select,.opt input[type=range]{font:14px var(--px);color:var(--ink);background:var(--btn);border:2px solid var(--edge);padding:3px 4px;accent-color:var(--gold)}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.panel .note{margin:0;font-size:12px;color:var(--dim);line-height:1.6}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.msg .blink{animation:none}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="top">
    <h1><b>混沌の終末</b> エクサ練習</h1>
    <button class="iconbtn" id="bOpt" type="button" aria-label="設定">⚙</button>
  </div>

  <div class="screen">
    <canvas id="cv" width="216" height="216" tabindex="0" aria-label="フィールド"></canvas>
    <div class="hud"><span id="hSet">SET -/6</span><span id="hHit">HIT 0</span></div>
    <div class="msg" id="msg"></div>
  </div>

  <p class="help"><kbd>WASD</kbd>/<kbd>矢印</kbd> 移動　<kbd>E</kbd> 向き回転　<kbd>Space</kbd> 安置表示　<kbd>Enter</kbd> スタート　<kbd>R</kbd> リトライ</p>

  <div class="pad">
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    <div class="btns">
      <button class="pbtn go" id="tStart" type="button">START</button>
      <button class="pbtn" id="tRetry" type="button">RETRY</button>
      <button class="pbtn" id="tRot" type="button">回転</button>
      <button class="pbtn" id="tSafe" type="button">安置</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <label class="opt"><span>最初の方向</span>
      <select id="oFirst"><option value="rand">ランダム</option><option value="NW">北西</option><option value="NE">北東</option></select></label>
    <label class="opt"><span>ゲーム速度 <span id="oSpeedV">100%</span></span>
      <input type="range" id="oSpeed" min="0.4" max="1" step="0.1" value="1"></label>
    <label class="opt"><span>エクサの進路を表示</span><input type="checkbox" id="oPath"></label>
    <label class="opt"><span>4点避けの位置を表示</span><input type="checkbox" id="oSpots"></label>
    <label class="opt"><span>マーカー</span>
      <select id="oMarker"><option value="nw">1=北西</option><option value="ne">1=北東</option></select></label>
    <label class="opt"><span>効果音</span><input type="checkbox" id="oSound" checked></label>
    <p class="note">6レーン中2本が光り、北西・北東から2.5秒ごとに交互に計6セット。予兆の4.6秒後から0.51秒間隔で6発、着弾円は半径6y。座標とタイミングは cactbot / Splatoon のデータから算出。</p>
    <button class="pbtn go" id="bClose" type="button">とじる</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ===== ギミック定数（docs/research-stray-apocalypse.md） =====
const ARENA_R = 20, EXA_R = 6, HIT_COUNT = 6;
const SET_INTERVAL = 2.5, FIRST_HIT = 4.6, HIT_GAP = 0.51;
const PLAYER_SPEED = 6, COUNTDOWN = 3;
const PATTERNS = { A: [-25, 5], B: [-15, 15], C: [-5, 25] }; // レーン i と i+3

// ===== 画面（内部 216px、1y = 4px） =====
const W = 216, PPY = 4, C0 = W / 2;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const px = x => Math.round(C0 + x * PPY);

// 8bitパレット
const P = {
  void:'#000000', floor:'#241c3c', floor2:'#2e2450', rim:'#6a5f94', grid:'#2a2148',
  exa:'#ff6a1a', exaHi:'#ffd24a', exaDk:'#8a2a08', tele:'#ffcf4a',
  safe:'#58e07a', boss:'#ff4d8d', ring:'#a33a6a', player:'#4ad4ff', hurt:'#ff4d5e', white:'#ffffff',
  mk:['#ff4d5e','#ffcf4a','#4ad4ff','#c08cff']
};

// ===== 設定（保存に失敗しても動く） =====
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('exa-kefka:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('exa-kefka:' + k, JSON.stringify(v)); } catch {} }
};
const opt = {
  first: store.get('first', 'rand'), speed: store.get('speed', 1), path: store.get('path', false),
  spots: store.get('spots', false), marker: store.get('marker', 'nw'), sound: store.get('sound', true),
  safe: store.get('safe', false)
};

// ===== 状態 =====
const S = { phase:'title', t:-COUNTDOWN, rot:0, sets:[], player:{x:0,z:5}, hits:0, hurtT:-9, clearT:0 };
const keys = new Set();
const stickVec = { x:0, z:0 };

// ===== 問題 =====
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeProblem(){
  const first = opt.first === 'rand' ? (Math.random() < .5 ? 'NW' : 'NE') : opt.first;
  const second = first === 'NW' ? 'NE' : 'NW';
  const p1 = shuffle(['A','B','C']), p2 = shuffle(['A','B','C']), list = [];
  for (let i = 0; i < 3; i++){ list.push({ dir:first, pat:p1[i] }); list.push({ dir:second, pat:p2[i] }); }
  return list;
}
// ボス北向き時のローカル座標（x=東, z=南）
function laneHit(dir, off, k){
  if (dir === 'NW'){ const s = -35 + 10 * k; return { x:(s + off) / 2, z:(s - off) / 2 }; }
  const d = 35 - 10 * k; return { x:(off + d) / 2, z:(off - d) / 2 };
}
function rotPt(p, r){ let { x, z } = p; for (let i = 0; i < r; i++) [x, z] = [-z, x]; return { x, z }; }
function buildSets(list){
  return list.map((w, k) => {
    const start = SET_INTERVAL * k;
    const lanes = PATTERNS[w.pat].map(off => ({
      spawn: rotPt(laneHit(w.dir, off, 0), S.rot),
      hits: Array.from({ length:HIT_COUNT }, (_, i) => {
        const p = rotPt(laneHit(w.dir, off, i + 1), S.rot);
        return { t:start + FIRST_HIT + HIT_GAP * i, x:p.x, z:p.z, done:false };
      })
    }));
    return { ...w, start, lanes };
  });
}
let problem = makeProblem();
const END_T = SET_INTERVAL * 5 + FIRST_HIT + HIT_GAP * (HIT_COUNT - 1);

function begin(same){
  if (!same) problem = makeProblem();
  S.sets = buildSets(problem);
  S.t = -COUNTDOWN; S.phase = 'count'; S.hits = 0; S.hurtT = -9;
  S.player = { x:0, z:5 };
  sfx.unlock(); sfx.blip(660, .08);
  cv.focus({ preventScroll:true });
}

// ===== 効果音（8bit矩形波） =====
const sfx = {
  ac:null,
  unlock(){ if (!opt.sound) return; try { this.ac ||= new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); } catch {} },
  tone(freq, dur, type = 'square', vol = .06, slide = 0){
    if (!opt.sound || !this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + .02);
  },
  blip(f, d){ this.tone(f, d); },
  boom(){ this.tone(140, .09, 'square', .025, -80); },
  hurt(){ this.tone(220, .25, 'sawtooth', .08, -160); },
  clear(){ [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, .12), i * 110)); },
  fail(){ [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, .16), i * 150)); }
};

// ===== ドット描画 =====
function rect(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
// 塗りつぶし円（スキャンライン、dither=true で市松）
function disc(cx, cy, r, c, dither, phase = 0){
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++){
    const hw = Math.floor(Math.sqrt(r * r - dy * dy));
    if (!dither){ ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); continue; }
    for (let dx = -hw; dx <= hw; dx++) if (((cx + dx + cy + dy + phase) & 1) === 0) ctx.fillRect(cx + dx, cy + dy, 1, 1);
  }
}
// 円の縁（ブレゼンハム）
function ring(cx, cy, r, c, dash){
  ctx.fillStyle = c;
  let x = r, y = 0, e = 1 - r, n = 0;
  while (x >= y){
    if (!dash || ((n >> 1) & 1) === 0){
      [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]].forEach(([a, b]) => ctx.fillRect(cx + a, cy + b, 1, 1));
    }
    y++; n++;
    if (e < 0) e += 2 * y + 1; else { x--; e += 2 * (y - x) + 1; }
  }
}
function line(x0, y0, x1, y1, c){
  ctx.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;){ ctx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy){ e += dy; x0 += sx; } if (e2 <= dx){ e += dx; y0 += sy; } }
}
function sprite(rows, cx, cy, pal){
  const h = rows.length, w = rows[0].length, ox = cx - (w >> 1), oy = cy - (h >> 1);
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') rect(ox + i, oy + j, 1, 1, pal[ch]); }));
}
// 3x5 ドット数字・英字（マーカー用）
const GLYPH = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  1:'010110010010111', 2:'110001010100111', 3:'110001010001110', 4:'101101111001001', N:'101111111111101'
};
function glyph(ch, cx, cy, c){
  const g = GLYPH[ch]; if (!g) return;
  for (let i = 0; i < 15; i++) if (g[i] === '1') rect(cx - 1 + (i % 3), cy - 2 + (i / 3 | 0), 1, 1, c);
}

const HERO = [
  '..kkk..',
  '.kccck.',
  '.kcwck.',
  'kbbbbbk',
  '.kbbbk.',
  '.kb.bk.',
  '.kk.kk.'
];
const HERO_PAL = { k:'#000000', c:'#ffe0b0', w:'#000000', b:P.player };
const HERO_HURT = { ...HERO_PAL, b:P.hurt };
const KEFKA = [
  '....r.y....',
  '...rryy....',
  '..rryyyy...',
  '..kffffk...',
  '..kfkfkf...',
  '..kffffk...',
  '..krrrrk...',
  '.kpprrppk..',
  'kpppyypppk.',
  '.kppyyppk..',
  '..kk..kk...'
];
const KEFKA_PAL = { r:'#ff4d5e', y:'#ffcf4a', k:'#000000', f:'#f4f0ff', p:'#9a4dff' };

function drawField(){
  rect(0, 0, W, W, P.void);
  // 星
  for (let i = 0; i < 40; i++){ const x = (i * 97) % W, y = (i * 53 + 17) % W; rect(x, y, 1, 1, i % 3 ? '#2a2448' : '#50487a'); }
  disc(C0, C0, ARENA_R * PPY, P.floor);
  // 5yタイル
  ctx.fillStyle = P.floor2;
  for (let gx = -20; gx < 20; gx += 5) for (let gz = -20; gz < 20; gz += 5){
    if (((gx + gz) / 5 & 1) !== 0) continue;
    for (let y = 0; y < 20; y++) for (let x = 0; x < 20; x++){
      const wx = gx + x / 4 + .125, wz = gz + y / 4 + .125;
      if (wx * wx + wz * wz < ARENA_R * ARENA_R) ctx.fillRect(px(gx) + x, px(gz) + y, 1, 1);
    }
  }
  ring(C0, C0, ARENA_R * PPY, P.rim);
  ring(C0, C0, ARENA_R * PPY + 1, '#3a3354');
  // マーカー
  const m = 16, d = Math.round(m / Math.SQRT2);
  [['A',0,-m],['B',m,0],['C',0,m],['D',-m,0]].forEach(([t, x, z], i) => { ring(px(x), px(z), 5, P.mk[i]); glyph(t, px(x), px(z), P.mk[i]); });
  const corners = opt.marker === 'nw' ? [[-d,-d],[d,-d],[d,d],[-d,d]] : [[d,-d],[d,d],[-d,d],[-d,-d]];
  corners.forEach(([x, z], i) => {
    const X = px(x), Z = px(z), c = P.mk[i];
    line(X - 5, Z - 5, X + 5, Z - 5, c); line(X + 5, Z - 5, X + 5, Z + 5, c); line(X + 5, Z + 5, X - 5, Z + 5, c); line(X - 5, Z + 5, X - 5, Z - 5, c);
    glyph(String(i + 1), X, Z, c);
  });
  glyph('N', C0, px(-ARENA_R) - 5, '#8c83a8');
}

function drawBoss(){
  ring(C0, C0, 22, P.ring, true);
  const f = rotPt({ x:0, z:-1 }, S.rot);
  // 正面マーカー（三角）
  const tx = C0 + f.x * 25, tz = C0 + f.z * 25, sx = -f.z, sz = f.x;
  for (let i = 0; i < 4; i++) line(Math.round(tx - f.x * i + sx * i), Math.round(tz - f.z * i + sz * i), Math.round(tx - f.x * i - sx * i), Math.round(tz - f.z * i - sz * i), P.boss);
  sprite(KEFKA, C0, C0, KEFKA_PAL);
}

function drawSpots(){
  if (!opt.spots) return;
  [[0,-5],[5,0],[0,5],[-5,0]].forEach(([x, z]) => ring(px(x), px(z), 3, '#c08cff'));
}

function drawSafe(){
  if (!opt.safe || S.phase !== 'run') return;
  const pending = [];
  S.sets.forEach(s => { if (S.t >= s.start) s.lanes.forEach(l => l.hits.forEach(h => { if (!h.done) pending.push(h); })); });
  if (!pending.length) return;
  ctx.fillStyle = P.safe;
  const r2 = EXA_R * EXA_R, R2 = ARENA_R * ARENA_R;
  for (let y = 0; y < W; y += 2) for (let x = (y >> 1) & 1 ? 2 : 0; x < W; x += 4){
    const wx = (x - C0 + .5) / PPY, wz = (y - C0 + .5) / PPY;
    if (wx * wx + wz * wz > R2) continue;
    let ok = true;
    for (const h of pending){ const dx = wx - h.x, dz = wz - h.z; if (dx * dx + dz * dz <= r2){ ok = false; break; } }
    if (ok) ctx.fillRect(x, y, 2, 2);
  }
}

function drawExas(){
  const t = S.t, blink = Math.floor(performance.now() / 120) & 1;
  S.sets.forEach(s => {
    if (t < s.start) return;
    const tt = t - s.start;
    s.lanes.forEach(l => {
      const h1 = l.hits[0], h2 = l.hits[1];
      if (opt.path && !l.hits[HIT_COUNT - 1].done) l.hits.forEach(h => { if (!h.done) ring(px(h.x), px(h.z), EXA_R * PPY, '#5a4a2a'); });
      // 予兆：1発目の円（点滅破線）＋ 進行方向の矢印 ＋ 場外の発生源
      if (tt < FIRST_HIT){
        ring(px(h1.x), px(h1.z), EXA_R * PPY, blink ? P.tele : '#a0781e', true);
        const ux = (h2.x - h1.x) / 7.07, uz = (h2.z - h1.z) / 7.07;
        const ax = px(h1.x - ux * 3), az = px(h1.z - uz * 3), bx = px(h1.x + ux * 3.5), bz = px(h1.z + uz * 3.5);
        line(ax, az, bx, bz, P.tele); line(ax + 1, az, bx + 1, bz, P.tele);
        const back = 7, side = 5;
        line(bx, bz, Math.round(bx - ux * back * 1 - uz * side), Math.round(bz - uz * back + ux * side), P.tele);
        line(bx, bz, Math.round(bx - ux * back + uz * side), Math.round(bz - uz * back - ux * side), P.tele);
        disc(px(l.spawn.x), px(l.spawn.z), 4, blink ? P.exaHi : P.exa);
      }
      // 着弾
      l.hits.forEach(h => {
        const dt = t - h.t;
        if (dt < -.15 || dt > .4) return;
        const X = px(h.x), Z = px(h.z), R = EXA_R * PPY;
        if (dt < 0){ disc(X, Z, R, P.exaDk, true); return; }
        const k = dt / .4;
        if (k < .35){ disc(X, Z, R, P.exa); disc(X, Z, Math.round(R * .6), P.exaHi); disc(X, Z, Math.round(R * .25), P.white); }
        else { disc(X, Z, R, P.exaDk, true, 1); ring(X, Z, Math.round(R * (0.6 + k * .4)), P.exa); }
      });
    });
  });
}

function drawPlayer(){
  const hurt = performance.now() - S.hurtT < 500;
  if (hurt && (Math.floor(performance.now() / 60) & 1)) return; // 点滅
  sprite(HERO, px(S.player.x), px(S.player.z) - 2, hurt ? HERO_HURT : HERO_PAL);
  rect(px(S.player.x), px(S.player.z) + 2, 1, 1, '#ffffff'); // 判定点
}

function draw(){
  drawField(); drawSafe(); drawSpots(); drawBoss(); drawExas(); drawPlayer();
}

// ===== HUD / メッセージ =====
const hSet = $('hSet'), hHit = $('hHit'), msg = $('msg');
let lastMsg = '';
function setMsg(html){ if (html !== lastMsg){ msg.innerHTML = html; lastMsg = html; } }
const DIR8 = ['北','北東','東','南東','南','南西','西','北西'];
function patName(s){
  if (s.pat === 'B') return '中';
  const base = s.dir === 'NW' ? (s.pat === 'A' ? 5 : 1) : (s.pat === 'A' ? 7 : 3);
  return DIR8[(base + 2 * S.rot) % 8] + '端';
}
function dirName(s){ return DIR8[((s.dir === 'NW' ? 7 : 1) + 2 * S.rot) % 8]; }
function updateHud(){
  const n = S.phase === 'run' || S.phase === 'done' ? S.sets.filter(s => S.t >= s.start).length : 0;
  hSet.textContent = `SET ${n || '-'}/6`;
  hHit.textContent = `HIT ${S.hits}`; hHit.className = S.hits ? 'hit' : '';
  const touch = document.body.classList.contains('touch');
  if (S.phase === 'title') setMsg(`<div class="big">EXAFLARE</div><div class="sub blink">${touch ? 'STARTをタップ' : 'Enterでスタート'}</div>`);
  else if (S.phase === 'count') setMsg(`<div class="big">${Math.ceil(-S.t)}</div>`);
  else if (S.phase === 'done'){
    const ok = S.hits === 0;
    const order = S.sets.map(s => `${dirName(s)}${patName(s)}`).join(' → ');
    setMsg(`<div class="big" style="color:${ok ? 'var(--green)' : 'var(--red)'}">${ok ? 'CLEAR!' : 'HIT ' + S.hits}</div><div class="sub">${order}</div><div class="sub blink">${touch ? 'START / RETRY' : 'Enter:次の問題　R:リトライ'}</div>`);
  } else setMsg('');
}

// ===== 更新 =====
function movePlayer(dt){
  let mx = stickVec.x, mz = stickVec.z;
  if (keys.has('w')) mz -= 1; if (keys.has('s')) mz += 1;
  if (keys.has('a')) mx -= 1; if (keys.has('d')) mx += 1;
  const len = Math.hypot(mx, mz); if (!len) return;
  let x = S.player.x + mx / len * PLAYER_SPEED * dt, z = S.player.z + mz / len * PLAYER_SPEED * dt;
  const r = Math.hypot(x, z); if (r > ARENA_R - .5){ x *= (ARENA_R - .5) / r; z *= (ARENA_R - .5) / r; }
  S.player.x = x; S.player.z = z;
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000) * opt.speed; last = now;
  movePlayer(dt);
  if (S.phase === 'count' || S.phase === 'run'){
    const before = S.t;
    S.t += dt;
    if (S.phase === 'count'){
      if (Math.ceil(-before) !== Math.ceil(-S.t) && S.t < 0) sfx.blip(660, .08);
      if (S.t >= 0){ S.phase = 'run'; sfx.blip(990, .15); }
    }
    if (S.phase === 'run'){
      let boom = false;
      S.sets.forEach(s => s.lanes.forEach(l => l.hits.forEach(h => {
        if (h.done || S.t < h.t) return;
        h.done = true; boom = true;
        const dx = S.player.x - h.x, dz = S.player.z - h.z;
        if (dx * dx + dz * dz <= EXA_R * EXA_R){ S.hits++; S.hurtT = now; sfx.hurt(); }
      })));
      if (boom) sfx.boom();
      if (S.t > END_T + .6){ S.phase = 'done'; S.hits ? sfx.fail() : sfx.clear(); }
    }
  }
  draw(); updateHud();
  requestAnimationFrame(frame);
}

// ===== 入力：キーボード =====
const KEYMAP = { w:'w', arrowup:'w', s:'s', arrowdown:'s', a:'a', arrowleft:'a', d:'d', arrowright:'d' };
function rotate(){
  if (S.phase === 'count' || S.phase === 'run') return;
  S.rot = (S.rot + 1) % 4;
  S.sets = buildSets(problem); S.sets.forEach(s => s.lanes.forEach(l => l.hits.forEach(h => h.done = true)));
  sfx.unlock(); sfx.blip(440, .05);
}
function toggleSafe(){ opt.safe = !opt.safe; store.set('safe', opt.safe); $('tSafe').classList.toggle('on', opt.safe); }
function start(){ begin(false); }
window.addEventListener('keydown', e => {
  if (!$('sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
  const k = e.key.toLowerCase();
  if (KEYMAP[k]){ keys.add(KEYMAP[k]); e.preventDefault(); return; }
  if (k === ' '){ toggleSafe(); e.preventDefault(); }
  else if (k === 'e') rotate();
  else if (k === 'enter'){ start(); e.preventDefault(); }
  else if (k === 'r') begin(true);
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.key.toLowerCase()]; if (k) keys.delete(k); });
window.addEventListener('blur', () => { keys.clear(); stickVec.x = stickVec.z = 0; });

// ===== 入力：スマホ（バーチャルスティック + ボタン） =====
const game = $('game');
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
window.addEventListener('touchstart', () => document.body.classList.add('touch'), { once:true, passive:true });

const stick = $('stick'), knob = $('knob');
let stickId = null;
function stickMove(e){
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dz = e.clientY - (r.top + R);
  const d = Math.hypot(dx, dz), max = R - 20;
  if (d > max){ dx *= max / d; dz *= max / d; }
  knob.style.transform = `translate(${dx}px,${dz}px)`;
  const n = Math.hypot(dx, dz) / max;
  if (n < .2){ stickVec.x = stickVec.z = 0; } else { stickVec.x = dx / Math.hypot(dx, dz); stickVec.z = dz / Math.hypot(dx, dz); }
}
function stickEnd(){ stickId = null; stickVec.x = stickVec.z = 0; knob.style.transform = ''; }
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); e.preventDefault(); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
stick.addEventListener('pointerup', stickEnd);
stick.addEventListener('pointercancel', stickEnd);

// 画面をドラッグしても移動できる（スティック代わり）
let dragId = null, dragO = null;
cv.addEventListener('pointerdown', e => { dragId = e.pointerId; dragO = { x:e.clientX, y:e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const dx = e.clientX - dragO.x, dz = e.clientY - dragO.y, d = Math.hypot(dx, dz);
  if (d < 10){ stickVec.x = stickVec.z = 0; return; }
  stickVec.x = dx / d; stickVec.z = dz / d;
  if (d > 60){ dragO.x = e.clientX - dx / d * 60; dragO.y = e.clientY - dz / d * 60; } // 追従
});
['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, e => { if (e.pointerId === dragId){ dragId = null; stickVec.x = stickVec.z = 0; } }));

$('tStart').addEventListener('click', start);
$('tRetry').addEventListener('click', () => begin(true));
$('tRot').addEventListener('click', rotate);
$('tSafe').addEventListener('click', toggleSafe);
$('tSafe').classList.toggle('on', opt.safe);

// ===== 設定シート =====
const oFirst = $('oFirst'), oSpeed = $('oSpeed'), oPath = $('oPath'), oSpots = $('oSpots'), oMarker = $('oMarker'), oSound = $('oSound');
oFirst.value = opt.first; oSpeed.value = opt.speed; oPath.checked = opt.path; oSpots.checked = opt.spots; oMarker.value = opt.marker; oSound.checked = opt.sound;
function speedLabel(){ $('oSpeedV').textContent = Math.round(opt.speed * 100) + '%'; }
speedLabel();
oFirst.addEventListener('change', () => { opt.first = oFirst.value; store.set('first', opt.first); });
oSpeed.addEventListener('input', () => { opt.speed = parseFloat(oSpeed.value); store.set('speed', opt.speed); speedLabel(); });
oPath.addEventListener('change', () => { opt.path = oPath.checked; store.set('path', opt.path); });
oSpots.addEventListener('change', () => { opt.spots = oSpots.checked; store.set('spots', opt.spots); });
oMarker.addEventListener('change', () => { opt.marker = oMarker.value; store.set('marker', opt.marker); });
oSound.addEventListener('change', () => { opt.sound = oSound.checked; store.set('sound', opt.sound); if (opt.sound) sfx.unlock(); });
function closeSheet(){ $('sheet').hidden = true; cv.focus({ preventScroll:true }); }
$('bOpt').addEventListener('click', () => { $('sheet').hidden = false; });
$('bClose').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

// 初期表示：タイトル画面にも問題の配置だけ用意しておく
S.sets = buildSets(problem); S.sets.forEach(s => s.lanes.forEach(l => l.hits.forEach(h => h.done = true)));
requestAnimationFrame(frame);
})();
</script>
</body>
