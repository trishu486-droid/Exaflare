# 旧住所（GitHub Pages）には、新しいURL（Cloudflare Pages：dancing-mad-sim.pages.dev）へすぐ転送するページ（gh-redirect/）だけを出す
# 検索エンジンに「引っ越した」と伝えて、検索結果を新しいURLに寄せるため（2026-10-17 ユーザー）。リポジトリを非公開にするときにこのファイルを消す
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
