<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>絶ケフカP5トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#0b0a14;
  --ink:#f2ecff;
  --dim:#8c83a8;
  --edge:#3a3354;
  --btn:#1d1930;
  --gold:#ffcf4a;
  --red:#ff4d5e;
  --green:#58e07a;
  --ab:#a3245c;
  --gb-body:#c5c4bd;
  --gb-ink:#2b2a5c;
  --gb-dim:#6a6980;
  --gb-dark:#34333d;
  --gb-bezel:#5d5b6e;
  --px: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--gb-body);color:var(--gb-ink);font:15px/1.5 var(--px);padding-inline:16px;padding-block:12px 16px;display:flex;justify-content:center;align-items:flex-start;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}

.gb{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:6px}
.top h1{margin:0;font:400 14px/1.2 var(--px);letter-spacing:.06em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gb-dim)}
.top h1 b{color:var(--ab);font-weight:400}
.top h1 span{color:var(--gb-ink)}
.mini{font:13px var(--px);color:#e8e6f0;background:var(--gb-dark);border:2px solid #1e1d24;border-radius:4px;min-width:36px;height:32px;padding:0 8px;cursor:pointer;touch-action:manipulation}
.mini.on{background:#2f6b3f;border-color:#1e4a2a;color:#d8ffe0}
.screen{position:relative;color:var(--ink);background:#1c1a3c;overflow:hidden;border:10px solid var(--gb-bezel);border-radius:8px 8px 28px 8px}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}

/* 画面内の表示 */
.outline{text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.cast{position:absolute;left:12%;right:12%;bottom:11%;pointer-events:none}
.cast .bar{height:clamp(8px,2.2vw,12px);border:3px solid #ff9f2a;background:#3a2a55;box-shadow:0 0 0 2px #000}
.cast .fill{height:100%;width:0;background:#fff}
.cast .name{text-align:right;font-size:clamp(16px,5vw,24px);line-height:1.2;margin-top:2px}
.hud{position:absolute;inset:auto 8px 6px 8px;display:flex;justify-content:space-between;pointer-events:none;font-size:clamp(11px,3.2vw,15px);font-variant-numeric:tabular-nums}
.hud .hit{color:var(--red)}
.buff{position:absolute;left:8px;top:6px;font-size:clamp(11px,3.2vw,14px);color:var(--gold);pointer-events:none;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.buff span{display:flex;align-items:center;gap:5px}
.buff svg{width:1.35em;height:1.35em;flex:none;box-shadow:0 0 0 2px #000}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap}
.msg .big{font-size:clamp(26px,9vw,42px);line-height:1.1}
.msg .sub{font-size:clamp(11px,3.2vw,14px);color:var(--ink);margin-top:6px}
.msg .blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
/* ギミック選択メニュー */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vw,10px);background:rgba(0,0,0,.72)}
.menu .head{font-size:clamp(18px,6vw,28px);color:var(--gold)}
.menu .note{font-size:clamp(11px,3.2vw,13px);color:var(--dim)}
.menu button{width:min(78%,360px);font:clamp(14px,4.4vw,19px)/1.2 var(--px);color:var(--ink);background:#15121f;border:3px solid var(--edge);padding:8px 10px;text-align:left;cursor:pointer;touch-action:manipulation;display:flex;justify-content:space-between;gap:8px}
.menu button small{font-size:.7em;color:var(--dim);align-self:center}
.menu button.cur{border-color:var(--gold);color:var(--gold)}
.menu button.cur::before{content:"▶";margin-right:4px}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;transform:translate(-50%,0);font-size:clamp(13px,4vw,18px);color:#fff;white-space:nowrap;animation:dmg .9s steps(9) forwards;font-variant-numeric:tabular-nums}
.dmg.crit{color:var(--gold);font-size:clamp(16px,5vw,23px)}
.dmg.miss{color:#ff4d5e;font-size:clamp(15px,4.6vw,21px);text-align:center;line-height:1.1;animation-duration:1.4s}
.dmg.miss small{display:block;font-size:.72em;color:#fff}
@keyframes dmg{0%{opacity:1;margin-top:0}70%{opacity:1}100%{opacity:0;margin-top:-28px}}

/* ===== 操作部 ===== */
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 0}
.stick{position:relative;width:128px;height:128px;flex:none;border:3px solid #9d9ca3;border-radius:50%;background:radial-gradient(circle,#b5b4ad 0 60%,#aaa9a2 61%);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--gb-dark);border:3px solid #1e1d24;box-shadow:inset -4px -4px 0 #1e1d24, inset 3px 3px 0 #55545f;pointer-events:none}
.ab{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,54px);margin-right:2px}
.abw{display:flex;align-items:center;justify-content:center}
.abw.x{grid-area:1/2}.abw.y{grid-area:2/1}.abw.a{grid-area:2/3}.abw.b{grid-area:3/2}
.round{--p:0;width:56px;height:56px;border-radius:50%;font:18px/1 var(--px);color:#fff;cursor:pointer;touch-action:none;border:3px solid #6d1840;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.18);
  background:conic-gradient(rgba(0,0,0,.66) calc(var(--p) * 360deg), transparent 0), var(--ab)}
.abw.x .round,.abw.y .round{background:conic-gradient(rgba(0,0,0,.66) calc(var(--p) * 360deg), transparent 0), #5b2a86;border-color:#3a1660}
.round small{font-size:8px;line-height:1;max-width:50px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#ffe7f2}
.round.ready{border-color:var(--gold)}
.round.press{transform:translateY(2px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.35)}
.ss{display:flex;justify-content:center;gap:26px;margin-top:8px}
.ssw{display:flex;flex-direction:column;align-items:center;gap:3px;transform:rotate(-25deg)}
.ssw span{font-size:11px;color:var(--gb-ink);letter-spacing:.08em}
.pill{width:58px;height:16px;border-radius:8px;background:#77767f;border:2px solid #4a4952;cursor:pointer;touch-action:manipulation;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.pill:active{transform:translateY(1px)}
.help{margin:0;text-align:center;color:var(--gb-dim);font-size:12px;line-height:1.9}
.help kbd{font:12px var(--px);color:#e8e6f0;border:2px solid #1e1d24;padding:0 4px;background:var(--gb-dark)}
.touch .help{display:none}

/* ===== 設定 ===== */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.panel{color:var(--ink);width:100%;max-width:380px;max-height:100%;overflow:auto;background:#131022;border:4px solid var(--edge);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:400 16px var(--px);color:var(--gold)}
.panel h3{margin:4px 0 0;font:400 13px var(--px);color:var(--dim)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt select,.opt input[type=range]{font:14px var(--px);color:var(--ink);background:var(--btn);border:2px solid var(--edge);padding:3px 4px;accent-color:var(--gold);max-width:60%}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.panel .note{margin:0;font-size:12px;color:var(--dim);line-height:1.6}
.close{font:14px var(--px);color:var(--gold);background:var(--btn);border:3px solid var(--gold);height:44px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.msg .blink{animation:none}.dmg{animation-duration:.01s}}
</style>
</head>
<body>
<div class="gb" id="game">
  <div class="top">
    <h1><b id="mechName">絶ケフカP5</b> <span id="jobName">ナイト</span></h1>
    <button class="mini" id="bSafe" type="button" aria-pressed="false">安置</button>
    <button class="mini" id="bRetry" type="button" aria-label="同じ問題をやり直す">↻</button>
    <button class="mini" id="bMenu" type="button" aria-label="ギミック選択に戻る">≡</button>
    <button class="mini" id="bOpt" type="button" aria-label="設定">⚙</button>
  </div>

  <div class="screen">
    <canvas id="cv" width="288" height="288" tabindex="0" aria-label="フィールド"></canvas>
    <div class="fx" id="fx"></div>
    <div class="buff outline" id="buff"></div>
    <div class="cast outline" id="cast" hidden><div class="bar"><div class="fill" id="castFill"></div></div><div class="name" id="castName"></div></div>
    <div class="hud outline"><span id="hSet"></span><span id="hDmg">DMG 0</span><span id="hHit">HIT 0</span></div>
    <div class="msg outline" id="msg"></div>
    <div class="menu" id="menu" hidden>
      <div class="head outline">ギミック選択</div>
      <div id="menuList" style="display:contents"></div>
      <div class="note outline">十字で選んでA／STARTで開始</div>
    </div>
  </div>

  <div class="controls">
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    <div class="ab">
      <div class="abw x"><button class="round" id="btnX" type="button" aria-label="Xボタン"><b>X</b><small></small></button></div>
      <div class="abw y"><button class="round" id="btnY" type="button" aria-label="Yボタン"><b>Y</b><small></small></button></div>
      <div class="abw a"><button class="round" id="btnA" type="button" aria-label="Aボタン"><b>A</b><small></small></button></div>
      <div class="abw b"><button class="round" id="btnB" type="button" aria-label="Bボタン"><b>B</b><small></small></button></div>
    </div>
  </div>

  <div class="ss">
    <div class="ssw"><button class="pill" id="btnSelect" type="button" aria-label="SELECT：ジョブ変更"></button><span>SELECT</span></div>
    <div class="ssw"><button class="pill" id="btnStart" type="button" aria-label="START：開始"></button><span>START</span></div>
  </div>

  <p class="help"><kbd>WASD</kbd> 移動　<kbd>J</kbd> A　<kbd>K</kbd> B　<kbd>U</kbd> X　<kbd>I</kbd> Y　<kbd>Enter</kbd> START　<kbd>Shift</kbd> SELECT<br><kbd>Space</kbd> 安置表示　<kbd>R</kbd> リトライ　<kbd>Esc</kbd> ギミック選択</p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <label class="opt"><span>ゲーム速度 <span id="oSpeedV">100%</span></span>
      <input type="range" id="oSpeed" min="0.4" max="1" step="0.1" value="1"></label>
    <label class="opt"><span>補助表示（進路・予兆を残す）</span><input type="checkbox" id="oPath"></label>
    <label class="opt"><span>立ち位置ガイド</span><input type="checkbox" id="oSpots"></label>
    <label class="opt"><span>マーカー</span>
      <select id="oMarker"><option value="nw">1=北西</option><option value="ne">1=北東</option></select></label>
    <label class="opt"><span>効果音</span><input type="checkbox" id="oSound" checked></label>
    <h3>混沌の終末</h3>
    <label class="opt"><span>最初の方向</span>
      <select id="oFirst"><option value="rand">ランダム</option><option value="NW">北西</option><option value="NE">北東</option></select></label>
    <h3>スリースターズ</h3>
    <label class="opt"><span>デバフ</span>
      <select id="oDebuff"><option value="rand">ランダム</option><option value="0">ファイア</option><option value="1">サンダー</option><option value="2">ブリザド</option><option value="-1">なし</option></select></label>
    <label class="opt"><span>2本ある属性（デバフ持ち）</span>
      <select id="oDouble"><option value="first">時計回りで手前</option><option value="second">時計回りで奥</option></select></label>
    <p class="note">座標とタイミングは cactbot・Splatoon・AnoMech のゲームデータから算出。ミッシングの床の消え方は実戦ログ1件の配置を再現しています。</p>
    <button class="close" id="bClose" type="button">とじる</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ===== 共通定数 =====
const ARENA_R = 20, BOSS_R = 6, PLAYER_SPEED = 6, COUNTDOWN = 3;
const SQ2 = Math.SQRT2;

// ===== ジョブ（pot は見た目のダメージ用。slots は練習できる担当） =====
// A：GCD（3段コンボ or 詠唱魔法） B/X/Y：アビリティ・バフ・一部はGCD技（gcd:true）
const BUFFS = {
  invuln:  { name:'インビンシブル', dur:10, mit:true, invuln:true, color:'#ffd84a' },
  rampart: { name:'ランパート', dur:20, mit:true, color:'#5ab0ff' },
  sheltron:{ name:'シェルトロン', dur:8, mit:true, color:'#8ad0ff' },
  riddle:  { name:'紅蓮の極意', dur:20, dmg:1.15, color:'#ff8a3a' },
  bh:      { name:'桃園結義', dur:20, dmg:1.05, color:'#ffb84a' },
  wf:      { name:'ワイルドファイア', dur:10, dmg:1.1, color:'#ff6a3a' },
  soil:    { name:'野戦治療の陣', dur:18, mit:true, color:'#58e07a' },
  exped:   { name:'疾風怒濤の計', dur:20, mit:true, color:'#9ae07a' },
};
// step：コンボの段（1→2→3の順に押すとフル威力、順番を外すと low の威力）
const JOBS = {
  pld: { name:'ナイト', role:'tank', melee:true, slots:['MT','ST'],
         a:{ name:'ロイヤルアソリティ', pot:460 },
         b:{ name:'インビンシブル', cd:420, buff:'invuln' },
         x:{ name:'ランパート', cd:90, buff:'rampart' },
         y:{ name:'シェルトロン', cd:15, buff:'sheltron' } },
  mnk: { name:'モンク', role:'melee', melee:true, slots:['D1','D2'],
         a:{ name:'連撃', pot:220, step:1 },
         b:{ name:'正拳突き', pot:320, step:2, low:150 },
         y:{ name:'崩拳', pot:420, step:3, low:180 },
         x:{ name:'陰陽闘気斬', cd:10, pot:340 } },
  mch: { name:'機工士', role:'ranged', melee:false, slots:['D3'],
         a:{ name:'ヒートスプリットショット', pot:220, step:1 },
         b:{ name:'ヒートスラッグショット', pot:320, step:2, low:160 },
         y:{ name:'ヒートクリーンショット', pot:440, step:3, low:180 },
         x:{ name:'チェックメイト', cd:10, pot:170 } },
  blm: { name:'黒魔道士', role:'caster', melee:false, slots:['D4'],
         a:{ name:'ファイジャ', pot:320, cast:2.0 },
         b:{ name:'迅速魔', cd:40, instant:1 },
         x:{ name:'ゼノグロシー', cd:30, gcd:true, pot:880 },
         y:{ name:'三連魔', cd:60, instant:3 } },
  sch: { name:'学者', role:'healer', melee:false, slots:['H1','H2'],
         a:{ name:'気炎法', pot:310, cast:1.5 },
         b:{ name:'エナジードレイン', cd:10, pot:100 },
         x:{ name:'野戦治療の陣', cd:30, buff:'soil' },
         y:{ name:'疾風怒濤の計', cd:120, buff:'exped' } },
};
const JOB_ORDER = ['pld', 'mnk', 'mch', 'blm', 'sch'];
const KEYS = ['a', 'b', 'x', 'y'];
// GCD を使うボタン（A・コンボの段・GCD技）か
const isGcd = (j, k) => k === 'a' || !!j[k].step || !!j[k].gcd;
const GCD = 2.5, QUEUE = 0.5, MELEE = 3, SLIDECAST = 0.5;

// ===== 画面（内部 288px。1y あたりのピクセル数はギミックごとに変える） =====
const W = 288, C0 = W / 2;
let PPY = 4;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const px = x => Math.round(C0 + x * PPY);

// 8bitパレット
const P = {
  void:'#000000', space:'#1c1a3c', star:'#4a4478', floor:'#4b4c8a', grid:'#3e3f7a', diag:'#3a3a70', rim:'#4c6ed8', rim2:'#2d3f8f',
  exa:'#ff7a1f', exaDk:'#3a1606', exaHi:'#ffe08a', chev:'#fff4d6', white:'#ffffff',
  safe:'#58e07a', boss:'#b04a8a', bossEdge:'#d8609c', bossTip:'#ff5aa8', hurt:'#ff2a3a',
  water:'#3ab8ff', waterHi:'#c8f0ff', purple:'#b05aff', purpleDk:'#3a1060',
  mk:['#ff5a5a','#ffd84a','#5ad0ff','#d08cff']
};

// ===== 設定（保存に失敗しても動く） =====
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('exa-kefka:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('exa-kefka:' + k, JSON.stringify(v)); } catch {} }
};
const opt = {
  first: store.get('first', 'rand'), speed: store.get('speed', 1), path: store.get('path', false),
  spots: store.get('spots', false), marker: store.get('marker', 'nw'), sound: store.get('sound', true),
  safe: store.get('safe', false), job: store.get('job', 'pld'), mech: store.get('mech', 'exa'),
  debuff: store.get('debuff', 'rand'), dbl: store.get('dbl', 'first'), slot: store.get('slot', {})
};
if (!JOBS[opt.job]) opt.job = 'pld';
const job = () => JOBS[opt.job];
// 担当（MT/ST・D1/D2・H1/H2 は切り替え式、他は固定）
const mySlot = () => { const sl = job().slots; return sl.includes(opt.slot[opt.job]) ? opt.slot[opt.job] : sl[0]; };

// ===== 状態 =====
const S = { phase:'menu', t:-COUNTDOWN, player:{ x:0, z:5 }, hits:0, hurtT:-9, inst:null, problem:null, cursor:0 };
const keys = new Set();
const stickVec = { x:0, z:0 };

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.random() * a.length | 0];

// ===== 効果音（8bit矩形波） =====
const sfx = {
  ac:null,
  unlock(){ if (!opt.sound) return; try { this.ac ||= new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); } catch {} },
  tone(freq, dur, type = 'square', vol = .06, slide = 0){
    if (!opt.sound || !this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + .02);
  },
  blip(f, d){ this.tone(f, d); },
  boom(){ this.tone(140, .09, 'square', .025, -80); },
  splash(){ this.tone(420, .18, 'triangle', .05, -300); },
  hurt(){ this.tone(220, .25, 'sawtooth', .08, -160); },
  hit(){ this.tone(988, .05, 'square', .04); },
  crit(){ this.tone(1318, .08, 'square', .045); },
  no(){ this.tone(160, .12, 'square', .05); },
  buff(){ [660, 880].forEach((f, i) => setTimeout(() => this.tone(f, .06, 'triangle', .06), i * 60)); },
  clear(){ [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, .12), i * 110)); },
  fail(){ [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, .16), i * 150)); }
};

// ===== ドット描画 =====
function rect(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function disc(cx, cy, r, c){
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++){ const hw = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
// ドーナツ（内側 r0 〜 外側 r1）
function donut(cx, cy, r0, r1, c){
  ctx.fillStyle = c;
  for (let dy = -r1; dy <= r1; dy++){
    const o = Math.floor(Math.sqrt(r1 * r1 - dy * dy));
    const i = Math.abs(dy) < r0 ? Math.ceil(Math.sqrt(r0 * r0 - dy * dy)) : 0;
    if (!i){ ctx.fillRect(cx - o, cy + dy, o * 2 + 1, 1); continue; }
    ctx.fillRect(cx - o, cy + dy, o - i + 1, 1); ctx.fillRect(cx + i, cy + dy, o - i + 1, 1);
  }
}
function ring(cx, cy, r, c){
  ctx.fillStyle = c;
  let x = r, y = 0, e = 1 - r;
  while (x >= y){
    [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]].forEach(([a, b]) => ctx.fillRect(cx + a, cy + b, 1, 1));
    y++;
    if (e < 0) e += 2 * y + 1; else { x--; e += 2 * (y - x) + 1; }
  }
}
function line(x0, y0, x1, y1, c){
  ctx.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;){ ctx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy){ e += dy; x0 += sx; } if (e2 <= dx){ e += dx; y0 += sy; } }
}
function alpha(a, fn){ ctx.globalAlpha = a; fn(); ctx.globalAlpha = 1; }
function thickRing(cx, cy, r, c, w){ for (let i = 0; i < w; i++) ring(cx, cy, r - i, c); }
// フィールド内だけを行ごとに塗る。span(z) は x の範囲 [x0, x1] を返す
function fillArena(span, c){
  const R = ARENA_R * PPY;
  ctx.fillStyle = c;
  for (let y = -R; y <= R; y++){
    const hw = Math.sqrt(R * R - y * y), z = (y + .5) / PPY;
    const s = span(z); if (!s) continue;
    const x0 = Math.max(-hw, Math.ceil(s[0] * PPY)), x1 = Math.min(hw, Math.floor(s[1] * PPY));
    if (x1 >= x0) ctx.fillRect(C0 + x0, C0 + y, x1 - x0 + 1, 1);
  }
}
// 3x5 ドット数字・英字
const GLYPH = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  1:'010110010010111', 2:'110001010100111', 3:'110001010001110', 4:'101101111001001', 5:'111100110001110'
};
function glyph(ch, cx, cy, c){
  const g = GLYPH[ch]; if (!g) return;
  for (let i = 0; i < 15; i++) if (g[i] === '1') rect(cx - 1 + (i % 3), cy - 2 + (i / 3 | 0), 1, 1, c);
}
function icon5(rows, cx, cy, c){ rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'x') rect(cx - 2 + i, cy - 2 + j, 1, 1, c); })); }
// 2px太さのL字（斜め方向の山形矢印）
function corner(cx, cz, sx, sz, L, c){
  rect(Math.min(cx, cx - sx * (L - 1)), sz > 0 ? cz - 1 : cz, L, 2, c);
  rect(sx > 0 ? cx - 1 : cx, Math.min(cz, cz - sz * (L - 1)), 2, L, c);
}

function drawField(){
  rect(0, 0, W, W, P.space);
  for (let i = 0; i < 60; i++) rect((i * 97 + 13) % W, (i * 53 + 29) % W, 1, 1, P.star);
  const R = ARENA_R * PPY;
  disc(C0, C0, R, P.floor);
  // 床の模様：2yグリッド + 10yごとの斜め線
  ctx.fillStyle = P.grid;
  for (let k = -10; k <= 10; k++){
    const o = Math.round(k * 2 * PPY); if (Math.abs(o) >= R) continue;
    const hw = Math.floor(Math.sqrt(R * R - o * o));
    ctx.fillRect(C0 + o, C0 - hw, 1, hw * 2 + 1); ctx.fillRect(C0 - hw, C0 + o, hw * 2 + 1, 1);
  }
  ctx.fillStyle = P.diag;
  const D = Math.round(10 * PPY);
  for (let y = -R; y <= R; y++){
    const hw = Math.floor(Math.sqrt(R * R - y * y));
    for (let k = -4; k <= 4; k++){
      const xa = k * D - y, xb = y + k * D;
      if (Math.abs(xa) <= hw) ctx.fillRect(C0 + xa, C0 + y, 1, 1);
      if (Math.abs(xb) <= hw) ctx.fillRect(C0 + xb, C0 + y, 1, 1);
    }
  }
  S.inst?.drawFloor?.(S.t);
  thickRing(C0, C0, R + 3, P.rim, 3);
  ring(C0, C0, R + 4, P.rim2);
  // フィールドマーカー
  const m = 16, d = Math.round(m / SQ2);
  [['A',0,-m],['B',m,0],['C',0,m],['D',-m,0]].forEach(([t, x, z], i) => {
    alpha(.35, () => disc(px(x), px(z), 5, P.mk[i])); ring(px(x), px(z), 5, P.mk[i]); glyph(t, px(x), px(z), P.white);
  });
  const corners = opt.marker === 'nw' ? [[-d,-d],[d,-d],[d,d],[-d,d]] : [[d,-d],[d,d],[-d,d],[-d,-d]];
  corners.forEach(([x, z], i) => {
    const X = px(x), Z = px(z), c = P.mk[i];
    alpha(.35, () => rect(X - 5, Z - 5, 11, 11, c));
    line(X - 5, Z - 5, X + 5, Z - 5, c); line(X + 5, Z - 5, X + 5, Z + 5, c); line(X + 5, Z + 5, X - 5, Z + 5, c); line(X - 5, Z + 5, X - 5, Z - 5, c);
    glyph(String(i + 1), X, Z, P.white);
  });
}

// ボス：塗りつぶしのターゲットサークル + 正面の三角（北向き）
function drawBoss(){
  const R = BOSS_R * PPY;
  alpha(.6, () => disc(C0, C0, R, P.boss));
  ring(C0, C0, R, P.bossEdge);
  alpha(.5, () => ring(C0, C0, R - 6, P.bossEdge));
  for (let i = 0; i < 5; i++) line(C0 - i, C0 - R - 4 + i, C0 + i, C0 - R - 4 + i, P.bossTip);
  if (performance.now() - A.bossFlash < 90) alpha(.5, () => disc(C0, C0, R, P.white)); // 被ダメの白フラッシュ
}

function drawSafe(){
  const inst = S.inst;
  if (!opt.safe || S.phase !== 'run' || !inst.safeActive?.(S.t)) return;
  const R2 = ARENA_R * ARENA_R;
  ctx.globalAlpha = .45; ctx.fillStyle = P.safe;
  for (let y = 0; y < W; y += 2) for (let x = 0; x < W; x += 2){
    const wx = (x - C0 + 1) / PPY, wz = (y - C0 + 1) / PPY;
    if (wx * wx + wz * wz > R2) continue;
    if (inst.safe(wx, wz, S.t)) ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
}

// 被弾（1回の判定につき1カウント）
let missStack = 0, missStackT = 0;
const misses = new Map(); // 理由 → 回数
function hurt(reason, onBoard = reason){
  const now = performance.now();
  S.hits++; S.hurtT = now; sfx.hurt();
  misses.set(reason, (misses.get(reason) || 0) + 1);
  // 同時に2つミスしたときは縦にずらして両方見せる
  missStack = now - missStackT < 200 ? missStack + 1 : 0; missStackT = now;
  const el = document.createElement('div');
  el.className = 'dmg outline miss';
  el.innerHTML = onBoard ? `MISS<small>${onBoard}</small>` : 'MISS';
  el.style.left = (px(S.player.x) / W * 100) + '%';
  el.style.top = Math.max(2, (px(S.player.z) - 34) / W * 100 - missStack * 9) + '%';
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 1450);
}
function drawHurtFlash(){
  const dt = performance.now() - S.hurtT; if (dt > 400) return;
  const a = 1 - dt / 400;
  alpha(.22 * a, () => rect(0, 0, W, W, P.hurt));
  alpha(a, () => { rect(0, 0, W, 4, P.hurt); rect(0, W - 4, W, 4, P.hurt); rect(0, 0, 4, W, P.hurt); rect(W - 4, 0, 4, W, P.hurt); });
}
const inArena = (x, z) => x * x + z * z <= ARENA_R * ARENA_R;

// =====================================================================
// ギミック1：混沌の終末（エクサ）
// =====================================================================
const EXA = (() => {
  const EXA_R = 6, HIT_COUNT = 6, SET_INTERVAL = 2.5, FIRST_HIT = 4.6, HIT_GAP = 0.51;
  const PATTERNS = { A:[-25, 5], B:[-15, 15], C:[-5, 25] }; // レーン i と i+3
  const END = SET_INTERVAL * 5 + FIRST_HIT + HIT_GAP * (HIT_COUNT - 1);
  function laneHit(dir, off, k){
    if (dir === 'NW'){ const s = -35 + 10 * k; return { x:(s + off) / 2, z:(s - off) / 2 }; }
    const d = 35 - 10 * k; return { x:(off + d) / 2, z:(off - d) / 2 };
  }
  function exaMark(X, Z, sx, sz, on){
    const R = EXA_R * PPY;
    alpha(.35, () => disc(X, Z, R, P.exa));
    thickRing(X, Z, R, on ? P.exa : '#c9561a', 2);
    [[-7, '#c98a5a'], [1, '#ffd9a8'], [9, P.chev]].forEach(([o, c]) => corner(X + sx * o, Z + sz * o, sx, sz, 10, c));
  }
  return {
    id:'exa', name:'混沌の終末', sub:'エクサフレア', view:36, start:{ x:0, z:5 },
    gen(){
      const first = opt.first === 'rand' ? pick(['NW','NE']) : opt.first, second = first === 'NW' ? 'NE' : 'NW';
      const p1 = shuffle(['A','B','C']), p2 = shuffle(['A','B','C']), list = [];
      for (let i = 0; i < 3; i++){ list.push({ dir:first, pat:p1[i] }); list.push({ dir:second, pat:p2[i] }); }
      return list;
    },
    create(list){
      const sets = list.map((w, k) => {
        const start = SET_INTERVAL * k;
        const lanes = PATTERNS[w.pat].map(off => ({
          spawn: laneHit(w.dir, off, 0),
          hits: Array.from({ length:HIT_COUNT }, (_, i) => { const p = laneHit(w.dir, off, i + 1); return { t:start + FIRST_HIT + HIT_GAP * i, x:p.x, z:p.z, done:false }; })
        }));
        return { ...w, start, lanes };
      });
      const all = sets.flatMap(s => s.lanes.flatMap(l => l.hits));
      const pending = t => sets.filter(s => t >= s.start).flatMap(s => s.lanes.flatMap(l => l.hits.filter(h => !h.done)));
      return {
        end: END,
        casts: [{ name:'混沌の終末', start:0, len:3.9 }],
        progress: t => `SET ${sets.filter(s => t >= s.start).length}/6`,
        tick(t){
          let boom = false;
          all.forEach(h => {
            if (h.done || t < h.t) return;
            h.done = true; boom = true;
            if ((S.player.x - h.x) ** 2 + (S.player.z - h.z) ** 2 <= EXA_R * EXA_R) hurt('エクサに被弾', '');
          });
          if (boom) sfx.boom();
        },
        safeActive: t => pending(t).length > 0,
        safe(x, z, t){ return pending(t).every(h => (x - h.x) ** 2 + (z - h.z) ** 2 > EXA_R * EXA_R); },
        guide(){ [[0,-5],[5,0],[0,5],[-5,0]].forEach(([x, z]) => { ring(px(x), px(z), 3, P.white); rect(px(x), px(z), 1, 1, P.white); }); },
        draw(t){
          const blink = (Math.floor(performance.now() / 150) & 1) === 0;
          sets.forEach(s => {
            if (t < s.start) return;
            s.lanes.forEach(l => {
              const h1 = l.hits[0], h2 = l.hits[1];
              const sx = Math.sign(h2.x - h1.x), sz = Math.sign(h2.z - h1.z);
              if (opt.path && !l.hits[HIT_COUNT - 1].done) l.hits.forEach(h => { if (!h.done) ring(px(h.x), px(h.z), EXA_R * PPY, '#8a7ad0'); });
              if (t - s.start < FIRST_HIT) exaMark(px(l.spawn.x), px(l.spawn.z), sx, sz, blink); // 予兆は場外の発生地点
              l.hits.forEach(h => {
                const dt = t - h.t;
                if (dt < 0 || dt > .4) return;
                const X = px(h.x), Z = px(h.z), R = EXA_R * PPY, k = dt / .4;
                if (k < .3){ alpha(.85, () => disc(X, Z, R, P.exa)); disc(X, Z, Math.round(R * .55), P.exaHi); disc(X, Z, Math.round(R * .2), P.white); }
                else { alpha(.5 * (1 - k), () => disc(X, Z, R, P.exa)); ring(X, Z, Math.round(R * (.55 + k * .45)), P.exaHi); }
              });
            });
          });
        },
      };
    }
  };
})();

// =====================================================================
// ギミック2：フラッド（斜めの帯 × 4回。予兆は1.2秒だけ、着弾は約6秒後）
// =====================================================================
const FLOOD = (() => {
  const HALF = 5, TELE_AT = 0.4, STAGGER = 1.02, TELE_LEN = 1.2, RESOLVE = 6.05;
  // 帯の横位置：'A' は北西→南東向きの帯（u = (x−z)/√2）、'B' は北東→南西向きの帯（v = (−x−z)/√2）
  const perp = (fam, x, z) => fam === 'A' ? (x - z) / SQ2 : (-x - z) / SQ2;
  function span(fam, c, z){
    const lo = SQ2 * (c - HALF), hi = SQ2 * (c + HALF);
    return fam === 'A' ? [z + lo, z + hi] : [-z - hi, -z - lo];
  }
  function pairs(rev){ return rev ? [[-5, 15], [-15, 5]] : [[5, -15], [15, -5]]; }
  return {
    id:'flood', name:'フラッド', sub:'カオティックフラッド', view:24, start:{ x:0, z:2 },
    gen(){ return { first:pick(['A','B']), revA:Math.random() < .5, revB:Math.random() < .5 }; },
    create(p){
      const second = p.first === 'A' ? 'B' : 'A';
      const pf = pairs(p.first === 'A' ? p.revA : p.revB), ps = pairs(second === 'A' ? p.revA : p.revB);
      const order = [[p.first, pf[0]], [second, ps[0]], [p.first, pf[1]], [second, ps[1]]];
      const ticks = order.map(([fam, offs], k) => ({ fam, offs, tele:TELE_AT + k * STAGGER, hit:TELE_AT + k * STAGGER + RESOLVE, done:false }));
      const inTick = (tk, x, z) => tk.offs.some(c => Math.abs(perp(tk.fam, x, z) - c) <= HALF);
      const next = t => ticks.find(tk => !tk.done && t >= tk.tele);
      return {
        end: ticks[3].hit + .8,
        casts: [{ name:'フラッド', start:.3, len:4.7 }],
        progress: t => `WAVE ${ticks.filter(tk => tk.done).length}/4`,
        tick(t){
          ticks.forEach(tk => {
            if (tk.done || t < tk.hit) return;
            tk.done = true; sfx.splash();
            if (inTick(tk, S.player.x, S.player.z)) hurt('フラッドに被弾', '');
          });
        },
        safeActive: t => !!next(t),
        safe(x, z, t){ const tk = next(t); return !tk || !inTick(tk, x, z); },
        guide(){ [[0,-2],[2,0],[0,2],[-2,0]].forEach(([x, z]) => rect(px(x) - 1, px(z) - 1, 3, 3, P.white)); },
        draw(t){
          const blink = (Math.floor(performance.now() / 120) & 1) === 0;
          ticks.forEach((tk, k) => {
            // 予兆（実機は1.2秒だけ。補助表示ONなら着弾まで薄く残す）
            const showTele = t >= tk.tele && t < tk.tele + TELE_LEN;
            const keep = opt.path && t >= tk.tele && !tk.done;
            if (showTele || keep){
              tk.offs.forEach(c => {
                alpha(showTele ? .4 : .15, () => fillArena(z => span(tk.fam, c, z), P.exa));
                if (showTele && blink) alpha(.35, () => fillArena(z => span(tk.fam, c, z), P.exaHi));
              });
              if (keep && !showTele) tk.offs.forEach(c => { const s = span(tk.fam, c, 0); glyph(String(k + 1), px((s[0] + s[1]) / 2), C0, P.white); });
            }
            // 着弾：水の帯
            const dt = t - tk.hit;
            if (dt >= 0 && dt < .6){
              const a = 1 - dt / .6;
              tk.offs.forEach(c => {
                alpha(.75 * a, () => fillArena(z => span(tk.fam, c, z), P.water));
                alpha(.6 * a, () => fillArena(z => { const s = span(tk.fam, c, z), m = (s[0] + s[1]) / 2; return [m - 1, m + 1]; }, P.waterHi));
              });
            }
          });
        },
      };
    }
  };
})();

// ギミック3：スリースターズ（属性の塔 × 3セット + 二択のカタストロフ）
// =====================================================================
const CELES = (() => {
  // 時計回りに ファイア→サンダー→ブリザド の3本ずつ（北から20°、40°刻み、半径10）
  const EL = [
    { name:'ファイア', color:'#ff6a3a', icon:['..x..','.xx..','.xxx.','xxxxx','.xxx.'] },
    { name:'サンダー', color:'#c08cff', icon:['..xx.','.xx..','xxxx.','..xx.','.xx..'] },
    { name:'ブリザド', color:'#6ad8ff', icon:['x.x.x','.xxx.','xxxxx','.xxx.','x.x.x'] },
  ];
  const RING = 10, SOAK = 3, OFFSET = [1, 2, 0];
  const TOWER_ON = [6.1, 14.4, 20.6], RESOLVE = [14.18, 20.5, 26.34], OFF = [14.3, 20.6, 26.44];
  const CC_AT = [10.18, null, 22.34], CC_LEN = 4.0, DEBUFF_AT = 6.1, DEBUFF_LEN = 20;
  const towerPos = i => { const a = (20 + i * 40) * Math.PI / 180; return { x:Math.sin(a) * RING, z:-Math.cos(a) * RING }; };
  const TOWERS = Array.from({ length:9 }, (_, i) => ({ i, el:(i / 3) | 0, ...towerPos(i) }));
  // CC：quake=円（ボスから10y以内が危険）/ tornado=ドーナツ（10yより外が危険）
  const CC = { quake:{ name:'クエイク', color:'#e0a040', inner:true }, tornado:{ name:'トルネド', color:'#58e07a', inner:false } };
  return {
    id:'celes', name:'スリースターズ', sub:'属性の塔', view:24, start:{ x:0, z:4 },
    gen(){
      const debuff = opt.debuff === 'rand' ? pick([0, 0, 1, 1, 2, 2, -1, -1]) : Number(opt.debuff);
      const dbl = shuffle([0, 1, 2]);
      const active = [0, 1, 2].map(s => [0, 1, 2].flatMap(e => shuffle([0, 1, 2]).slice(0, e === dbl[s] ? 2 : 1).sort().map(sub => e * 3 + sub)));
      const cc = [pick(['quake','tornado']), null, pick(['quake','tornado'])];
      return { debuff, dbl, active, cc };
    },
    create(p){
      // その人が入る塔：デバフ持ちは属性をずらして（時計回り隣→さらに隣→自分の属性）、なしは2本ある属性のもう1本
      const target = [0, 1, 2].map(s => {
        const act = p.active[s];
        if (p.debuff < 0) return act.filter(i => TOWERS[i].el === p.dbl[s])[1];
        const el = (p.debuff + OFFSET[s]) % 3, mine = act.filter(i => TOWERS[i].el === el);
        return mine.length === 2 ? mine[opt.dbl === 'second' ? 1 : 0] : mine[0];
      });
      const done = [false, false, false], flash = [-9, -9, -9], towerMiss = [false, false, false];
      // 耐性低下デバフ：最初の1つ + 塔を踏むたびにその属性が20秒付く
      const debuffs = p.debuff < 0 ? [] : [{ el:p.debuff, from:DEBUFF_AT, until:DEBUFF_AT + DEBUFF_LEN }];
      const setAt = t => { for (let s = 2; s >= 0; s--) if (t >= TOWER_ON[s]) return s; return -1; };
      const casts = [{ name:'スリースターズ', start:1.0, len:4.7 }];
      CC_AT.forEach((at, s) => { if (at != null) casts.push({ name:'二択のカタストロフ', start:at, len:CC_LEN, color:CC[p.cc[s]].color }); });
      const inTarget = (s, x, z) => { const tw = TOWERS[target[s]]; return (x - tw.x) ** 2 + (z - tw.z) ** 2 <= SOAK * SOAK; };
      const ccSafe = (s, x, z) => { const c = p.cc[s]; if (!c) return true; const d = Math.hypot(x, z); return CC[c].inner ? d > RING : d < RING; };
      return {
        end: OFF[2] + 1.2,
        casts,
        progress: t => `SET ${Math.max(0, setAt(t) + 1)}/3`,
        status(t){
          const on = debuffs.filter(d => t >= d.from && t < d.until).map(d => ({ icon:EL[d.el], text:`${EL[d.el].name}耐性低下 ${Math.ceil(d.until - t)}` }));
          if (p.debuff < 0 && t >= DEBUFF_AT && t < DEBUFF_AT + 3) on.unshift('デバフなし');
          return on;
        },
        tick(t){
          for (let s = 0; s < 3; s++){
            if (done[s] || t < RESOLVE[s]) continue;
            done[s] = true; flash[s] = t; sfx.boom();
            const { x, z } = S.player;
            const inTower = p.active[s].find(i => (x - TOWERS[i].x) ** 2 + (z - TOWERS[i].z) ** 2 <= SOAK * SOAK);
            if (inTower != null) debuffs.push({ el:TOWERS[inTower].el, from:t, until:t + DEBUFF_LEN });
            if (!inTarget(s, x, z)){ towerMiss[s] = true; hurt(inTower == null ? '塔に入っていない' : '担当と違う塔'); }
            if (!ccSafe(s, x, z)) hurt(`${CC[p.cc[s]].name}に被弾`); // 塔ミスとは別に数える
          }
        },
        safeActive: t => { const s = setAt(t); return s >= 0 && !done[s]; },
        safe(x, z, t){ const s = setAt(t); return inTarget(s, x, z) && (t < (CC_AT[s] ?? 99) || ccSafe(s, x, z)); },
        guide(t){
          const s = setAt(t); if (s < 0 || done[s]) return;
          const tw = TOWERS[target[s]];
          ring(px(tw.x), px(tw.z), Math.round((SOAK + .8) * PPY), P.white);
        },
        draw(t){
          if (t < DEBUFF_AT) return;
          const s = setAt(t), blink = (Math.floor(performance.now() / 160) & 1) === 0;
          const lit = s >= 0 && t < OFF[s] ? p.active[s] : [];
          TOWERS.forEach(tw => {
            const X = px(tw.x), Z = px(tw.z), R = Math.round(SOAK * PPY), c = EL[tw.el].color;
            if (lit.includes(tw.i)){
              alpha(.45, () => disc(X, Z, R, c));
              thickRing(X, Z, R, blink ? P.white : c, 2);
            } else {
              alpha(.5, () => ring(X, Z, R, c));
            }
            icon5(EL[tw.el].icon, X, Z, lit.includes(tw.i) ? P.white : c);
          });
          // 二択のカタストロフ：詠唱中はボスが色で光り、着弾時に範囲が出る
          for (let k = 0; k < 3; k++){
            const cc = p.cc[k]; if (!cc) continue;
            if (t >= CC_AT[k] && t < RESOLVE[k]) thickRing(C0, C0, BOSS_R * PPY + 3, blink ? CC[cc].color : P.white, 2);
            const dt = t - RESOLVE[k];
            if (dt >= 0 && dt < .5){
              const R = RING * PPY;
              alpha(.55 * (1 - dt / .5), () => CC[cc].inner ? disc(C0, C0, R, CC[cc].color) : donut(C0, C0, R, ARENA_R * PPY, CC[cc].color));
            }
          }
          towerMiss.forEach((m, k) => {
            const dt = t - RESOLVE[k]; if (!m || dt < 0 || dt > 1.6) return;
            const tw = TOWERS[target[k]], R = Math.round((SOAK + .8) * PPY);
            thickRing(px(tw.x), px(tw.z), R, blink ? P.hurt : P.white, 2);
          });
          flash.forEach((f, k) => { const dt = t - f; if (dt >= 0 && dt < .35) p.active[k].forEach(i => alpha(.7 * (1 - dt / .35), () => disc(px(TOWERS[i].x), px(TOWERS[i].z), Math.round(SOAK * PPY), P.white))); });
        },
      };
    }
  };
})();

// =====================================================================
// ギミック4：ミッシング（床が2枚ずつ消える × 4ラウンド + 足元に落ちる紫の床）
// =====================================================================
const MISS = (() => {
  const TILE = 13.5, H = TILE / 2, PUDDLE_R = 5;
  const ROUND_AT = [10.0, 18.19, 26.35, 34.49], VANISH = 5.65, PUDDLE_DELAY = 1.87;
  // 実戦ログの消える順（タイル中心）：南西+中央 → 南東+北東 → 北+北西 → 南+東。最後に西だけ残る
  const VANISH_TILES = [[[-1, 1], [0, 0]], [[1, 1], [1, -1]], [[0, -1], [-1, -1]], [[0, 1], [1, 0]]];
  // ログでのパーティの立ち位置（紫の床が落ちた場所）と、最後に残る床
  const LOG_SPOTS = [[0, 13.5], [-7, 6.75], [-6.75, -6.75], [7, -6.75], [-13.5, 0]];
  const tileOf = (x, z) => [Math.max(-1, Math.min(1, Math.round(x / TILE))), Math.max(-1, Math.min(1, Math.round(z / TILE)))];
  const key = (a, b) => `${a},${b}`;
  return {
    id:'miss', name:'ミッシング', sub:'P5 時間切れ前', view:24, start:{ x:0, z:12 },
    gen(){ return {}; },
    create(){
      const gone = new Set(), warn = new Set(), puddles = [];
      const rounds = ROUND_AT.map((at, r) => ({ at, tiles:VANISH_TILES[r], baited:false, vanished:false }));
      let inVoid = false, inPuddle = new Set();
      const onVoid = (x, z) => gone.has(key(...tileOf(x, z)));
      const puddleAt = (x, z, t) => puddles.findIndex(p => t >= p.on && (x - p.x) ** 2 + (z - p.z) ** 2 <= PUDDLE_R * PUDDLE_R);
      const tileSpan = (tx, tz) => z => (z >= tz * TILE - H && z <= tz * TILE + H) ? [tx * TILE - H, tx * TILE + H] : null;
      return {
        end: ROUND_AT[3] + VANISH + 2.5,
        casts: [{ name:'ミッシング', start:0, len:4.1 }, ...ROUND_AT.slice(1).map(at => ({ name:'ミッシング', start:at - 2.5, len:2.5 })), { name:'ミッシング・ゼロ', start:ROUND_AT[3] + VANISH + .5, len:26 }],
        progress: t => `ROUND ${rounds.filter(r => t >= r.at).length}/4`,
        tick(t){
          const { x, z } = S.player;
          rounds.forEach(r => {
            if (!r.baited && t >= r.at + .08){ // 足元に紫の床（少し遅れて危険になる）
              r.baited = true; puddles.push({ x, z, at:t, on:t + PUDDLE_DELAY });
              r.tiles.forEach(tl => warn.add(key(...tl))); sfx.blip(300, .08);
            }
            if (!r.vanished && t >= r.at + VANISH){
              r.vanished = true; sfx.boom();
              r.tiles.forEach(tl => { gone.add(key(...tl)); warn.delete(key(...tl)); });
            }
          });
          // 消えた床・紫の床に入った瞬間に1回カウント
          const v = onVoid(x, z);
          if (v && !inVoid) hurt('落下');
          inVoid = v;
          const now = new Set(puddles.map((p, i) => (t >= p.on && (x - p.x) ** 2 + (z - p.z) ** 2 <= PUDDLE_R * PUDDLE_R) ? i : -1).filter(i => i >= 0));
          now.forEach(i => { if (!inPuddle.has(i)) hurt('紫の床'); });
          inPuddle = now;
        },
        safeActive: () => true,
        safe(x, z, t){
          const k = key(...tileOf(x, z));
          if (gone.has(k) || warn.has(k)) return false;
          return !puddles.some(p => (x - p.x) ** 2 + (z - p.z) ** 2 <= PUDDLE_R * PUDDLE_R);
        },
        guide(t){
          LOG_SPOTS.forEach(([x, z], i) => { ring(px(x), px(z), 4, P.white); glyph(String(i + 1), px(x), px(z), P.white); });
        },
        drawFloor(t){
          // 床の区切り線
          ctx.fillStyle = '#2e2f66';
          [-H, H].forEach(v => { fillArena(z => [v - .1, v + .1], '#2e2f66'); fillArena(z => (Math.abs(z - v) < .12 ? [-99, 99] : null), '#2e2f66'); });
          const blink = (Math.floor(performance.now() / 180) & 1) === 0;
          for (let tx = -1; tx <= 1; tx++) for (let tz = -1; tz <= 1; tz++){
            const k = key(tx, tz);
            if (gone.has(k)){
              fillArena(tileSpan(tx, tz), P.void);
              for (let i = 0; i < 6; i++){ const sx = tx * TILE + ((i * 37) % 11) - 5, sz = tz * TILE + ((i * 23) % 11) - 5; if (inArena(sx, sz)) rect(px(sx), px(sz), 1, 1, '#50487a'); }
            } else if (warn.has(k)){
              alpha(blink ? .45 : .25, () => fillArena(tileSpan(tx, tz), P.exa));
            }
          }
          // 紫の床（落ちた直後は予兆の輪、少し後に危険な床になる）
          puddles.forEach(p => {
            const X = px(p.x), Z = px(p.z), R = Math.round(PUDDLE_R * PPY);
            if (t < p.on){ thickRing(X, Z, R, blink ? P.purple : P.white, 2); }
            else { alpha(.6, () => disc(X, Z, R, P.purple)); ring(X, Z, R, '#e0b0ff'); }
          });
        },
        draw(){},
      };
    }
  };
})();

// =====================================================================
// ギミック5（β）：狂気のオーケストラ 1回目（kanatan.info の処理法）
// 味方7人は正しく動く（着弾ギリギリまで動かない）。自分の担当はジョブで決まる（ナイト MT/ST、モンク D1/D2、機工士 D3、黒 D4、学者 H1/H2）
// =====================================================================
const ORCH = (() => {
  const HOLY_R = 5, TB_R = 4.5, STACK_R = 4, FLARE_R = 8, BOT_SPEED = 30; // 味方は着弾直前に駆け込む（答えが見えないように）
  const CAST_END = 5.0, W1 = 5.9, W2 = 9.1, FINAL = 12.6, MARK_AT = 1.5; // β：詠唱の長さと予兆のタイミングは推定
  // 散開位置（攻略図から読み取り）
  const SPREAD = {
    MT:{ x:-5, z:-12.4 }, ST:{ x:4.8, z:-12.9 },
    D3:{ x:-8.5, z:-5.9 }, D4:{ x:8.1, z:-5.9 }, D1:{ x:-8, z:1.5 }, D2:{ x:8.9, z:3.1 },
    H1:{ x:-3.7, z:7.3 }, H2:{ x:4, z:7.7 },
  };
  const NON_TANK = ['D1','D2','D3','D4','H1','H2'];
  const STACK = { x:0, z:-8.5 };                         // 2回目：タンクの頭割り（タゲサの外）
  const BAIT = [{ x:-4.5, z:0 }, { x:0, z:4.5 }, { x:4.5, z:0 }]; // 2回目：タゲサ内の西・南・東
  const FLARE_SPOT = { x:0, z:-18.5 };
  const SOUTH = { H1:{ x:-6.5, z:14.5 }, H2:{ x:-9, z:13 }, D1:{ x:3.5, z:16 }, D2:{ x:6, z:14.5 }, D3:{ x:1.5, z:13.5 }, D4:{ x:8.5, z:12.5 } };
  const ROLE_COL = { T:'#3a6ad8', H:'#3aa84e', D:'#d8404e' };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const outward = (p, r) => { const d = Math.hypot(p.x, p.z) || 1; return { x:p.x / d * r, z:p.z / d * r }; };
  const tileGlyph = { T:'111010010010010', H:'101101111101101', D:'110101101101110' };
  return {
    id:'orch', name:'オーケストラβ', sub:'狂気のオーケストラ 1回目', view:24, start:{ x:0, z:8 }, slots:true,
    gen(){
      return { me:mySlot(), targets:shuffle([...NON_TANK]).slice(0, 3) };
    },
    valid: d => d.me === mySlot(), // ジョブ・担当を変えたら引き直す
    create(p){
      const all = ['MT','ST', ...NON_TANK];
      // 2回目の誘導役：1回目で当たらなかった3人を、散開位置の西から順に 西・南・東 へ
      const baiters = NON_TANK.filter(k => !p.targets.includes(k)).sort((a, b) => SPREAD[a].x - SPREAD[b].x);
      const phaseSpot = (k, ph) => {
        if (ph === 0) return SPREAD[k];
        if (ph === 1){
          if (k === 'MT' || k === 'ST') return STACK;
          const bi = baiters.indexOf(k);
          return bi >= 0 ? BAIT[bi] : outward(SPREAD[k], 14);
        }
        if (k === 'MT') return FLARE_SPOT;   // ヘイト1位＝フレア
        if (k === 'ST') return STACK;        // ヘイト2位＝ホーリー（ボス前で無敵）
        return SOUTH[k];
      };
      // 自分の目安（ガイド表示・安置表示）は着弾のたびに次へ
      const spotAt = (k, t) => phaseSpot(k, t < W1 ? 0 : t < W2 ? 1 : 2);
      // 味方：着弾の0.15秒前に着くように、直前で駆け込む
      const DEADLINE = [W1, W2, FINAL];
      const botGoal = (b, t) => {
        const ph = t < W1 ? 0 : t < W2 ? 1 : 2;
        if (ph < 2){
          const nx = phaseSpot(b.k, ph + 1), leave = DEADLINE[ph + 1] - dist(b, nx) / BOT_SPEED - .15;
          if (t >= Math.max(leave, DEADLINE[ph] + .05)) return nx;
        }
        return phaseSpot(b.k, ph);
      };
      const bots = all.filter(k => k !== p.me).map(k => ({ k, ...SPREAD[k] }));
      const pos = k => k === p.me ? S.player : bots.find(b => b.k === k);
      const fired = { w1:false, w2:false, fin:false };
      let w2targets = [], lastT = 0;
      const fx = []; // { at, kind, x, z, r }
      const vuln = p.targets.includes(p.me);
      const roleOf = k => k[0] === 'M' || k[0] === 'S' ? 'T' : k[0];
      return {
        start: { ...SPREAD[p.me] },
        intro: `あなたは ${p.me}`,
        end: FINAL + .9,
        casts: [{ name:'狂気のオーケストラ', start:0, len:CAST_END }],
        progress: t => t < W1 ? '1回目' : t < W2 ? '2回目' : t < FINAL ? 'フレア/ホーリー' : '終了',
        status(t){
          const s = [`担当 ${p.me}`];
          if (t >= W1 && vuln) s.push('被魔法ダメージ増加');
          if (t >= W1 - .3 && t < FINAL && (p.me === 'MT' || p.me === 'ST')) s.push(`${p.me === 'MT' ? 'フレア' : 'ホーリー'} ${Math.ceil(FINAL - t)}`);
          return s;
        },
        tick(t){
          const dt = Math.max(0, t - lastT); lastT = t;
          // 味方は担当の位置へ歩く
          bots.forEach(b => {
            const g = botGoal(b, t), d = dist(b, g), step = BOT_SPEED * dt;
            if (d > .05){ const k = Math.min(1, step / d); b.x += (g.x - b.x) * k; b.z += (g.z - b.z) * k; }
          });
          const me = S.player;
          if (!fired.w1 && t >= W1){
            fired.w1 = true; sfx.boom();
            p.targets.forEach(k => fx.push({ at:t, kind:'holy', ...pos(k), r:HOLY_R }));
            ['MT','ST'].forEach(k => fx.push({ at:t, kind:'tb', ...pos(k), r:TB_R }));
            const overlap = p.targets.filter(k => k !== p.me).some(k => dist(me, pos(k)) <= HOLY_R);
            if (overlap) hurt('ホーリーが重なった');
            if (vuln && all.filter(k => k !== p.me && !p.targets.includes(k)).some(k => dist(me, pos(k)) <= HOLY_R)) hurt('ホーリーに味方を巻き込んだ');
            if (roleOf(p.me) !== 'T' && ['MT','ST'].some(k => dist(me, pos(k)) <= TB_R)) hurt('タンク強攻撃に巻き込まれた');
            if (roleOf(p.me) === 'T' && !hasMit()) hurt('軽減なしで強攻撃');
          }
          if (!fired.w2 && t >= W2){
            fired.w2 = true; sfx.boom();
            // ボスに近い3人（自分も含めて判定）
            w2targets = [...all].sort((a, b) => Math.hypot(pos(a).x, pos(a).z) - Math.hypot(pos(b).x, pos(b).z)).slice(0, 3);
            w2targets.forEach(k => fx.push({ at:t, kind:'holy', ...pos(k), r:HOLY_R }));
            fx.push({ at:t, kind:'stack', ...pos('MT'), r:STACK_R });
            const mine = w2targets.includes(p.me);
            if (roleOf(p.me) === 'T'){
              if (mine) hurt('タゲサに入った');
              if (dist(me, pos(p.me === 'MT' ? 'ST' : 'MT')) > STACK_R) hurt('頭割りに入れていない');
              else if (!hasMit()) hurt('軽減なしで頭割り');
            } else {
              if (mine && vuln) hurt('ホーリーを2回受けた');
              if (!mine && !vuln) hurt('近い3人に入れなかった');
              if (w2targets.filter(k => k !== p.me).some(k => dist(me, pos(k)) <= HOLY_R)) hurt('ホーリーが重なった');
              if (dist(me, pos('MT')) <= STACK_R) hurt('タンク頭割りに入った');
            }
          }
          if (!fired.fin && t >= FINAL){
            fired.fin = true; sfx.boom();
            fx.push({ at:t, kind:'flare', ...pos('MT'), r:FLARE_R });
            fx.push({ at:t, kind:'tb', ...pos('ST'), r:TB_R });
            if (p.me === 'MT'){ if (all.some(k => k !== 'MT' && dist(pos('MT'), pos(k)) <= FLARE_R)) hurt('フレアに味方を巻き込んだ'); }
            else if (dist(me, pos('MT')) <= FLARE_R) hurt('フレアに巻き込まれた');
            if (p.me === 'ST' && dist(me, STACK) > 3) hurt('ボス前でホーリーを受けていない');
            if (p.me === 'ST' && !hasBuff('invuln')) hurt('インビンシブルなしでホーリー');
          }
        },
        safeActive: () => true,
        safe(x, z, t){ return dist({ x, z }, spotAt(p.me, t)) <= 1.8; },
        guide(t){ const g = spotAt(p.me, t); ring(px(g.x), px(g.z), Math.round(1.8 * PPY), P.white); rect(px(g.x), px(g.z), 1, 1, P.white); },
        draw(t){
          const blink = (Math.floor(performance.now() / 160) & 1) === 0;
          // 1回目の予兆：ランダム3人に青い輪、MT/STに赤い輪
          if (t >= MARK_AT && t < W1){
            p.targets.forEach(k => { const q = pos(k); thickRing(px(q.x), px(q.z), Math.round(HOLY_R * PPY), blink ? '#5ab0ff' : P.white, 2); });
            ['MT','ST'].forEach(k => { const q = pos(k); thickRing(px(q.x), px(q.z), Math.round(TB_R * PPY), blink ? P.hurt : '#ff9a9a', 2); });
          }
          // 2回目の頭割り予兆（MTに）、フレア/ホーリーの予兆
          if (t >= W1 + .5 && t < W2){ const q = pos('MT'); ring(px(q.x), px(q.z), Math.round(STACK_R * PPY), blink ? P.hurt : P.white); }
          if (t >= W2 + .3 && t < FINAL){ const q = pos('MT'); ring(px(q.x), px(q.z), Math.round(FLARE_R * PPY), blink ? '#ff9a3a' : P.white); }
          // 着弾
          fx.forEach(f => {
            const dt = t - f.at; if (dt < 0 || dt > .6) return;
            const c = f.kind === 'holy' ? '#5ab0ff' : f.kind === 'flare' ? '#ff9a3a' : P.hurt;
            alpha(.6 * (1 - dt / .6), () => disc(px(f.x), px(f.z), Math.round(f.r * PPY), c));
          });
          // 味方
          bots.forEach(b => {
            const X = px(b.x), Z = px(b.z), r = roleOf(b.k);
            rect(X - 4, Z - 4, 9, 9, P.white); rect(X - 3, Z - 3, 7, 7, ROLE_COL[r]);
            const g = tileGlyph[r]; for (let i = 0; i < 15; i++) if (g[i] === '1') rect(X - 1 + (i % 3), Z - 2 + (i / 3 | 0), 1, 1, P.white);
          });
          // 2回目で狙われた人
          if (t >= W2 && t < W2 + .6) w2targets.forEach(k => { const q = pos(k); ring(px(q.x), px(q.z), Math.round(HOLY_R * PPY), P.white); });
        },
      };
    }
  };
})();

const MECHS = [EXA, FLOOD, CELES, MISS, ORCH];
const mech = () => MECHS.find(m => m.id === opt.mech) || EXA;

// ===== 詠唱バー（ボス） =====
const castEl = $('cast'), castFill = $('castFill'), castName = $('castName');
function drawCast(){
  const c = (S.phase === 'run' || S.phase === 'done') && S.inst ? S.inst.casts.find(c => S.t >= c.start && S.t < c.start + c.len && S.t <= S.inst.end) : null;
  castEl.hidden = !c;
  if (!c) return;
  if (castName.textContent !== c.name) castName.textContent = c.name;
  castFill.style.width = ((S.t - c.start) / c.len * 100).toFixed(1) + '%';
  castFill.style.background = c.color || '#fff';
}

function drawPlayer(){
  const now = performance.now(), hurtNow = now - S.hurtT < 500;
  drawIcon(px(S.player.x), px(S.player.z), hurtNow && (Math.floor(now / 70) & 1));
}

function draw(){
  PPY = (W / 2) / mech().view;
  drawField();
  if (opt.spots && S.inst) S.inst.guide?.(S.t);
  drawBoss();
  if (S.inst) S.inst.draw(S.t);
  drawSafe();
  drawActFx(); drawPlayer(); drawCast(); drawHurtFlash();
}

// ===== アクション（A=GCD。B・X・Y はアビリティ／バフ／コンボの段） =====
const A = { readyAt:0, queued:null, cast:null, combo:0, cds:{ b:0, x:0, y:0 }, q:{ b:false, x:false, y:false }, buffs:{}, instant:0,
            gcds:0, dmg:0, loss:0, failT:-9, bossFlash:-9 };
// 押しっぱなし：撃てるようになった瞬間に自動で発動（FF14 のホットバー長押しと同じ）
const held = { a:false, b:false, x:false, y:false };
function actReset(){
  Object.assign(A, { readyAt:0, queued:null, cast:null, combo:0, cds:{ b:0, x:0, y:0 }, q:{ b:false, x:false, y:false }, buffs:{}, instant:0, gcds:0, dmg:0, loss:0, failT:-9 });
  fxEl.innerHTML = '';
}
const hasBuff = id => (A.buffs[id] ?? -1) > S.t;
const hasMit = () => Object.keys(A.buffs).some(id => BUFFS[id].mit && hasBuff(id));
function inRange(){ return !job().melee || Math.hypot(S.player.x, S.player.z) <= BOSS_R + MELEE; }
function isMoving(){ return keys.size > 0 || stickVec.x !== 0 || stickVec.z !== 0; }

const fxEl = $('fx');
function popup(text, cls){
  const el = document.createElement('div');
  el.className = 'dmg outline ' + (cls || '');
  el.textContent = text;
  el.style.left = (50 + (Math.random() * 16 - 8)) + '%';
  el.style.top = (37 + Math.random() * 4) + '%';
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function dealDamage(pot){
  const up = Object.keys(A.buffs).reduce((m, id) => m * (hasBuff(id) && BUFFS[id].dmg ? BUFFS[id].dmg : 1), 1);
  const crit = Math.random() < .25;
  const dmg = Math.round(pot * 58 * up * (.95 + Math.random() * .1) * (crit ? 1.5 : 1));
  A.dmg += dmg; A.bossFlash = performance.now();
  popup(dmg.toLocaleString('en-US') + (crit ? '!' : ''), crit ? 'crit' : '');
  crit ? sfx.crit() : sfx.hit();
}
function fail(){ A.failT = performance.now(); sfx.no(); }

// 先行入力：リキャスト残り0.5秒から受け付ける（カウントダウン終了直前も可）
const active = () => S.phase === 'run' || S.phase === 'count';
function pressKey(k){
  sfx.unlock();
  if (!active()) return;
  const ab = job()[k];
  if (isGcd(job(), k)){
    if (ab.gcd){ if (S.t >= A.cds[k] - QUEUE) A.q[k] = true; return; } // GCD技：覚えておいて次のGCDで
    if (!A.cast && S.t >= A.readyAt - QUEUE) A.queued = k;
    return;
  }
  if (S.phase === 'count' || S.t < A.cds[k]){ if (S.t >= A.cds[k] - QUEUE) A.q[k] = true; return; }
  if (A.cast){ A.q[k] = true; return; } // 詠唱中に押したら、詠唱が終わってから発動
  if (ab.pot && !inRange()){ fail(); return; }
  A.cds[k] = S.t + ab.cd;
  if (ab.buff){ A.buffs[ab.buff] = S.t + BUFFS[ab.buff].dur; sfx.buff(); popup(ab.name, 'crit'); }
  else if (ab.instant){ A.instant = Math.max(A.instant, ab.instant); sfx.buff(); popup(ab.name, 'crit'); }
  else dealDamage(ab.pot);
}
function runGcd(k){
  const j = job(), ab = j[k];
  A.readyAt = S.t + GCD; A.gcds++;
  if (ab.gcd){ A.cds[k] = S.t + ab.cd; dealDamage(ab.pot); return; }
  if (ab.step){ // コンボ：前の段に続けて押すとフル威力
    const ok = ab.step === 1 || A.combo === ab.step - 1;
    dealDamage(ok ? ab.pot : ab.low);
    A.combo = ok && ab.step < 3 ? ab.step : 0;
    return;
  }
  if (!ab.cast){ dealDamage(ab.pot); return; }
  if (A.instant > 0){ A.instant--; dealDamage(ab.pot); return; }
  A.cast = { start:S.t, end:S.t + ab.cast };
}
function actTick(dt){
  const j = job(), a = j.a;
  KEYS.forEach(k => {
    const ab = j[k];
    if (held[k] && !A.cast){
      if (isGcd(j, k)) { if (!ab.gcd || S.t >= A.cds[k] - QUEUE) pressKey(k); }
      else if (S.t >= A.cds[k] && (!ab.pot || inRange())) pressKey(k);
    }
    if (k === 'a' || !A.q[k] || A.cast) return;
    if (ab.gcd){ if (S.t >= A.cds[k] - QUEUE && S.t >= A.readyAt - QUEUE){ A.q[k] = false; A.queued = k; } }
    else if (S.t >= A.cds[k]){ A.q[k] = false; pressKey(k); }
  });
  // 詠唱中：スライドキャスト猶予前に動くと中断（GCDは戻る）
  if (A.cast){
    if (isMoving() && S.t < A.cast.end - SLIDECAST){ A.cast = null; A.readyAt = S.t; fail(); }
    else if (S.t >= A.cast.end){ A.cast = null; dealDamage(a.pot); }
    return;
  }
  if (S.t < A.readyAt) return;
  if (A.queued){
    const k = A.queued; A.queued = null;
    if (j[k].gcd && S.t < A.cds[k]) return;
    if (!inRange()){ fail(); return; }
    runGcd(k);
    return;
  }
  if (S.t <= S.inst.end) A.loss += dt; // 撃てるのに撃っていない時間
}
function drawActFx(){
  const now = performance.now(), X = px(S.player.x), Z = px(S.player.z);
  if (job().melee && S.phase !== 'menu') alpha(.45, () => ring(C0, C0, Math.round((BOSS_R + MELEE) * PPY), '#c9a2ff'));
  if (now - A.failT < 500){ // 射程外・詠唱中断
    line(X - 3, Z - 14, X + 3, Z - 8, P.hurt); line(X + 3, Z - 14, X - 3, Z - 8, P.hurt);
    line(X - 2, Z - 14, X + 4, Z - 8, P.hurt); line(X + 4, Z - 14, X - 2, Z - 8, P.hurt);
  }
  if (A.cast){ // 詠唱バー（キャラの下）
    const k = Math.min(1, (S.t - A.cast.start) / (A.cast.end - A.cast.start));
    rect(X - 11, Z + 8, 22, 5, '#000000'); rect(X - 10, Z + 9, 20, 3, '#3a2a55'); rect(X - 10, Z + 9, Math.round(20 * k), 3, '#ffffff');
  }
}

const BTN = { a:$('btnA'), b:$('btnB'), x:$('btnX'), y:$('btnY') }, buffEl = $('buff');
// ステータスアイコン：属性色の四角に白いドット絵（右下に下向き矢印＝耐性低下）
function statusIcon({ color, icon }){
  let r = `<rect width="8" height="8" fill="${color}"/>`;
  icon.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === 'x') r += `<rect x="${i + .5}" y="${j + .5}" width="1" height="1" fill="#fff"/>`; }));
  r += '<rect x="5.5" y="5.5" width="2.5" height="2.5" fill="#000"/><rect x="6" y="6" width="1.5" height=".5" fill="#ff4d5e"/><rect x="6.5" y="6.5" width=".5" height="1" fill="#ff4d5e"/>';
  return `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const buffIcon = c => `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect width="8" height="8" fill="${c}"/><rect x="3" y="1" width="2" height="6" fill="#fff"/><rect x="1" y="3" width="6" height="2" fill="#fff"/></svg>`;
function setBtn(el, key, name, p, ready){
  el.style.setProperty('--p', p.toFixed(3));
  el.classList.toggle('ready', ready);
  const b = el.firstElementChild, sm = el.lastElementChild;
  if (b.textContent !== key) b.textContent = key;
  if (sm.textContent !== name) sm.textContent = name;
}
function drawButtons(){
  const run = S.phase === 'run', j = job();
  const gcdP = run ? Math.max(0, Math.min(1, (A.readyAt - S.t) / GCD)) : 0;
  KEYS.forEach(k => {
    const ab = j[k];
    if (isGcd(j, k) && !ab.gcd){
      // コンボは「次に押す段」だけ金枠
      const next = !ab.step || ab.step === 1 ? A.combo === 0 || !ab.step : A.combo === ab.step - 1;
      setBtn(BTN[k], k.toUpperCase(), ab.name, gcdP, run && gcdP === 0 && !A.cast && (!ab.step || next));
      return;
    }
    const left = run ? Math.max(0, A.cds[k] - S.t) : 0;
    setBtn(BTN[k], left > 0 ? String(Math.ceil(left)) : k.toUpperCase(), ab.name, Math.max(left / ab.cd, ab.gcd ? gcdP : 0), run && left === 0);
  });
  const st = [...[].concat(S.phase === 'run' || S.phase === 'done' ? S.inst?.status?.(S.t) ?? [] : [])];
  if (run) Object.keys(A.buffs).forEach(id => { if (hasBuff(id)) st.push({ buff:BUFFS[id], text:`${BUFFS[id].name} ${Math.ceil(A.buffs[id] - S.t)}` }); });
  if (run && A.instant) st.push(A.instant > 1 ? `三連魔 ×${A.instant}` : '迅速魔');
  const html = st.filter(Boolean).map(s => typeof s === 'string' ? `<span>${s}</span>`
    : s.buff ? `<span>${buffIcon(s.buff.color)}${s.text}</span>` : `<span>${statusIcon(s.icon)}${s.text}</span>`).join('');
  if (buffEl.innerHTML !== html) buffEl.innerHTML = html;
}

// ===== 進行 =====
function begin(same){
  const m = mech();
  if (!same || !S.problem || S.problem.mech !== m.id || m.valid?.(S.problem.data) === false) S.problem = { mech:m.id, data:m.gen() };
  S.inst = m.create(S.problem.data);
  S.t = -COUNTDOWN; S.phase = 'count'; S.hits = 0; S.hurtT = -9; misses.clear(); actReset();
  S.player = { ...(S.inst.start || m.start) };
  $('menu').hidden = true;
  sfx.unlock(); sfx.blip(660, .08);
  cv.focus({ preventScroll:true });
}
function openMenu(){
  S.phase = 'menu'; S.menu = 'mech'; S.inst = null; A.cast = null;
  S.cursor = Math.max(0, MECHS.indexOf(mech()));
  renderMenu(); $('menu').hidden = false; lastMsg = ''; setMsg('');
}
// メニュー：ジョブの行（SELECT／左右で切り替え）＋ ギミック一覧。担当が関係するギミックは次に MT/ST などを選ぶ
function renderMenu(){
  const head = $('menu').querySelector('.head'), note = $('menu').querySelector('.note');
  const jobRow = `<button type="button" data-job="1"><span>◀ ${job().name} ▶</span><small>ジョブ（SELECT）</small></button>`;
  if (S.menu === 'slot'){
    head.textContent = `${job().name}の担当`;
    note.textContent = '十字で選んでA／STARTで開始（Bでもどる）';
    $('menuList').innerHTML = job().slots.map((sl, i) => `<button type="button" data-i="${i}" class="${i === S.cursor ? 'cur' : ''}"><span>${sl}</span><small>${mech().name}</small></button>`).join('');
    return;
  }
  head.textContent = 'ギミック選択';
  note.textContent = '十字で選んでA／STARTで開始';
  $('menuList').innerHTML = jobRow + MECHS.map((m, i) => `<button type="button" data-i="${i}" class="${i === S.cursor ? 'cur' : ''}"><span>${m.name}</span><small>${m.sub}</small></button>`).join('');
}
function menuCount(){ return S.menu === 'slot' ? job().slots.length : MECHS.length; }
function menuConfirm(i = S.cursor){
  if (S.menu === 'slot'){
    opt.slot[opt.job] = job().slots[i]; store.set('slot', opt.slot); applyTitle(); begin(false);
    return;
  }
  opt.mech = MECHS[i].id; store.set('mech', opt.mech); applyTitle();
  if (MECHS[i].slots && job().slots.length > 1){
    S.menu = 'slot'; S.cursor = Math.max(0, job().slots.indexOf(mySlot())); renderMenu(); sfx.unlock(); sfx.blip(520, .04);
    return;
  }
  begin(false);
}
function menuBack(){ if (S.menu === 'slot'){ S.menu = 'mech'; S.cursor = Math.max(0, MECHS.indexOf(mech())); renderMenu(); } }
function moveCursor(d){ S.cursor = (S.cursor + d + menuCount()) % menuCount(); renderMenu(); sfx.unlock(); sfx.blip(520, .04); }

// ===== HUD / メッセージ =====
const hSet = $('hSet'), hHit = $('hHit'), hDmg = $('hDmg'), msg = $('msg');
let lastMsg = '';
function setMsg(html){ if (html !== lastMsg){ msg.innerHTML = html; lastMsg = html; } }
function updateHud(){
  const on = S.inst && (S.phase === 'run' || S.phase === 'done');
  hSet.textContent = on ? S.inst.progress(S.t) : '';
  hHit.textContent = `HIT ${S.hits}`; hHit.className = S.hits ? 'hit' : '';
  hDmg.textContent = `DMG ${A.dmg.toLocaleString('en-US')}`;
  if (S.phase === 'menu') setMsg('');
  else if (S.phase === 'count') setMsg(`<div class="big">${Math.ceil(-S.t)}</div><div class="sub">${mech().name}</div>${S.inst.intro ? `<div class="sub" style="color:var(--gold)">${S.inst.intro}</div>` : ''}`);
  else if (S.phase === 'done') setMsg(S.resultHtml);
  else setMsg('');
}
// リザルトは終了した瞬間の内容で固定する（後から SELECT でジョブを変えても変わらない）
function buildResult(){
  const ok = S.hits === 0;
  return `<div class="big" style="color:${ok ? 'var(--green)' : 'var(--red)'}">${ok ? 'CLEAR!' : 'HIT ' + S.hits}</div>` +
    rankHtml() +
    `<div class="sub">${job().name}　${A.dmg.toLocaleString('en-US')} DMG</div>` +
    `<div class="sub">GCD ${A.gcds}回 ／ GCDロス ${A.loss.toFixed(1)}秒</div>` +
    [...misses].map(([r, n]) => `<div class="sub" style="color:var(--red)">${r} ×${n}</div>`).join('') +
    `<div class="sub blink">START：次の問題　↻：リトライ　≡：ギミック選択</div>`;
}
// ランク：理論上の最大ダメージ（開幕から全GCD・アビリティを撃ち切った場合の期待値）に対する割合。被弾したら D
const RANKS = [['S', .95, '#ffcf4a'], ['A', .85, '#58e07a'], ['B', .70, '#5ad0ff'], ['C', .50, '#d08cff'], ['D', 0, '#8c83a8']];
function rankHtml(){
  const j = job(), end = S.inst.end, avg = 58 * 1.125; // クリ率25%・1.5倍の期待値
  const steps = KEYS.filter(k => j[k].step), aPot = steps.length ? steps.reduce((s, k) => s + j[k].pot, 0) / steps.length : j.a.pot;
  const og = KEYS.find(k => !isGcd(j, k) && j[k].pot);
  const max = (Math.floor(end / GCD) + 1) * aPot * avg + (og ? (Math.floor(end / j[og].cd) + 1) * j[og].pot * avg : 0);
  const ratio = A.dmg / max;
  const i = S.hits ? RANKS.length - 1 : RANKS.findIndex(r => ratio >= r[1]); // 被弾したら即 D（実戦なら落ちてDPS 0）
  const [name, , color] = RANKS[i];
  return `<div class="big" style="color:${color}">RANK ${name}</div><div class="sub">理論値の ${Math.round(ratio * 100)}%</div>`;
}
function applyTitle(){
  $('mechName').textContent = mech().name;
  $('jobName').textContent = job().name + (job().slots.length > 1 && mech().slots ? ` ${mySlot()}` : '');
}
function selectJob(d = 1){
  if (S.phase === 'count' || S.phase === 'run') return;
  opt.job = JOB_ORDER[(JOB_ORDER.indexOf(opt.job) + d + JOB_ORDER.length) % JOB_ORDER.length];
  store.set('job', opt.job); applyTitle(); lastMsg = '';
  if (S.phase === 'menu'){ if (S.menu === 'slot') menuBack(); renderMenu(); }
  sfx.unlock(); sfx.blip(520, .05);
}

// ===== 更新 =====
function movePlayer(dt){
  if (S.phase === 'menu') return;
  let mx = stickVec.x, mz = stickVec.z;
  if (keys.has('w')) mz -= 1; if (keys.has('s')) mz += 1;
  if (keys.has('a')) mx -= 1; if (keys.has('d')) mx += 1;
  const len = Math.hypot(mx, mz); if (!len) return;
  let x = S.player.x + mx / len * PLAYER_SPEED * dt, z = S.player.z + mz / len * PLAYER_SPEED * dt;
  const r = Math.hypot(x, z); if (r > ARENA_R - .5){ x *= (ARENA_R - .5) / r; z *= (ARENA_R - .5) / r; }
  S.player.x = x; S.player.z = z;
}

let last = performance.now(), stickRepeat = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000) * opt.speed; last = now;
  // メニューはスティックの上下でも選べる
  if (S.phase === 'menu' && Math.abs(stickVec.z) > .7 && now > stickRepeat){ moveCursor(stickVec.z > 0 ? 1 : -1); stickRepeat = now + 280; }
  movePlayer(dt);
  if (S.phase === 'count' || S.phase === 'run'){
    const before = S.t;
    S.t += dt;
    if (S.phase === 'count'){
      if (Math.ceil(-before) !== Math.ceil(-S.t) && S.t < 0) sfx.blip(660, .08);
      if (S.t >= 0){ S.phase = 'run'; sfx.blip(990, .15); }
    }
    if (S.phase === 'run'){
      S.inst.tick(S.t);
      actTick(dt);
      if (S.t > S.inst.end){ S.phase = 'done'; A.cast = null; S.resultHtml = buildResult(); S.hits ? sfx.fail() : sfx.clear(); }
    }
  }
  draw(); updateHud(); drawButtons();
  requestAnimationFrame(frame);
}

// ===== 入力：キーボード =====
const KEYMAP = { w:'w', arrowup:'w', s:'s', arrowdown:'s', a:'a', arrowleft:'a', d:'d', arrowright:'d' };
function toggleSafe(){ opt.safe = !opt.safe; store.set('safe', opt.safe); syncSafe(); }
function syncSafe(){ const b = $('bSafe'); b.classList.toggle('on', opt.safe); b.setAttribute('aria-pressed', String(opt.safe)); }
function pressStart(){ if (S.phase === 'menu') menuConfirm(); else begin(false); }
window.addEventListener('keydown', e => {
  if (!$('sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
  const k = e.key.toLowerCase();
  if (S.phase === 'menu'){
    if (k === 'w' || k === 'arrowup'){ moveCursor(-1); e.preventDefault(); return; }
    if (k === 's' || k === 'arrowdown'){ moveCursor(1); e.preventDefault(); return; }
    if (k === 'j' || k === '1' || k === 'enter'){ menuConfirm(); e.preventDefault(); return; }
    if (k === 'k' || k === '2' || k === 'escape'){ menuBack(); return; }
    if (k === 'a' || k === 'arrowleft'){ selectJob(-1); e.preventDefault(); return; }
    if (k === 'd' || k === 'arrowright' || k === 'shift'){ selectJob(1); e.preventDefault(); return; }
    return;
  }
  if (KEYMAP[k]){ keys.add(KEYMAP[k]); e.preventDefault(); return; }
  if (e.repeat) return;
  const bk = { j:'a', 1:'a', k:'b', 2:'b', u:'x', 3:'x', i:'y', 4:'y' }[k];
  if (bk){ held[bk] = true; pressKey(bk); e.preventDefault(); }
  else if (k === 'enter'){ pressStart(); e.preventDefault(); }
  else if (k === 'shift') selectJob();
  else if (k === ' '){ toggleSafe(); e.preventDefault(); }
  else if (k === 'r') begin(true);
  else if (k === 'escape') openMenu();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (KEYMAP[k]) keys.delete(KEYMAP[k]);
  const bk = { j:'a', 1:'a', k:'b', 2:'b', u:'x', 3:'x', i:'y', 4:'y' }[k];
  if (bk) held[bk] = false;
});
window.addEventListener('blur', () => { keys.clear(); stickVec.x = stickVec.z = 0; held.a = held.b = held.x = held.y = false; });

// ===== 入力：タッチ・マウス（スティックとボタンは同時に操作できる） =====
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
window.addEventListener('touchstart', () => document.body.classList.add('touch'), { once:true, passive:true });

const stick = $('stick'), knob = $('knob');
let stickId = null;
let stickO = null;
const STICK_DEAD = .55, STICK_MAX = 44; // 倒し幅 44px のうち 55% までは動かない
function stickMove(e){
  let dx = e.clientX - stickO.x, dz = e.clientY - stickO.y;
  const d = Math.hypot(dx, dz);
  if (d > STICK_MAX){ dx *= STICK_MAX / d; dz *= STICK_MAX / d; }
  knob.style.transform = `translate(${dx}px,${dz}px)`;
  if (d < STICK_MAX * STICK_DEAD){ stickVec.x = stickVec.z = 0; } else { stickVec.x = dx / d; stickVec.z = dz / d; }
}
function stickEnd(){ stickId = null; stickO = null; stickVec.x = stickVec.z = 0; knob.style.transform = ''; stickRepeat = 0; }
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stickO = { x:e.clientX, y:e.clientY }; try { stick.setPointerCapture(e.pointerId); } catch {} e.preventDefault(); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
stick.addEventListener('pointerup', stickEnd);
stick.addEventListener('pointercancel', stickEnd);

// 画面をドラッグしても移動できる
let dragId = null, dragO = null;
cv.addEventListener('pointerdown', e => { dragId = e.pointerId; dragO = { x:e.clientX, y:e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch {} });
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const dx = e.clientX - dragO.x, dz = e.clientY - dragO.y, d = Math.hypot(dx, dz);
  if (d < 30){ stickVec.x = stickVec.z = 0; return; }
  stickVec.x = dx / d; stickVec.z = dz / d;
  if (d > 60){ dragO.x = e.clientX - dx / d * 60; dragO.y = e.clientY - dz / d * 60; }
});
['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, e => { if (e.pointerId === dragId){ dragId = null; stickVec.x = stickVec.z = 0; } }));

// A/B は押した瞬間に反応させる
function holdButton(el, fn, onUp){
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('press'); fn(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t => el.addEventListener(t, () => { el.classList.remove('press'); onUp?.(); }));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
KEYS.forEach(k => holdButton(BTN[k], () => {
  if (S.phase === 'menu'){ if (k === 'a') menuConfirm(); else if (k === 'b') menuBack(); return; }
  held[k] = true; pressKey(k);
}, () => { held[k] = false; }));
$('btnStart').addEventListener('click', pressStart);
$('btnSelect').addEventListener('click', () => selectJob(1));
$('bRetry').addEventListener('click', () => { if (S.phase !== 'menu') begin(true); });
$('bMenu').addEventListener('click', openMenu);
$('bSafe').addEventListener('click', toggleSafe);
$('menuList').addEventListener('click', e => {
  if (e.target.closest('button[data-job]')){ selectJob(1); return; }
  const b = e.target.closest('button[data-i]'); if (b) menuConfirm(Number(b.dataset.i));
});
syncSafe();

// ===== 設定シート =====
const oFirst = $('oFirst'), oSpeed = $('oSpeed'), oPath = $('oPath'), oSpots = $('oSpots'), oMarker = $('oMarker'), oSound = $('oSound'), oDebuff = $('oDebuff'), oDouble = $('oDouble');
oFirst.value = opt.first; oSpeed.value = opt.speed; oPath.checked = opt.path; oSpots.checked = opt.spots; oMarker.value = opt.marker; oSound.checked = opt.sound;
oDebuff.value = String(opt.debuff); oDouble.value = opt.dbl;
function speedLabel(){ $('oSpeedV').textContent = Math.round(opt.speed * 100) + '%'; }
speedLabel();
oFirst.addEventListener('change', () => { opt.first = oFirst.value; store.set('first', opt.first); });
oSpeed.addEventListener('input', () => { opt.speed = parseFloat(oSpeed.value); store.set('speed', opt.speed); speedLabel(); });
oPath.addEventListener('change', () => { opt.path = oPath.checked; store.set('path', opt.path); });
oSpots.addEventListener('change', () => { opt.spots = oSpots.checked; store.set('spots', opt.spots); });
oMarker.addEventListener('change', () => { opt.marker = oMarker.value; store.set('marker', opt.marker); });
oSound.addEventListener('change', () => { opt.sound = oSound.checked; store.set('sound', opt.sound); if (opt.sound) sfx.unlock(); });
oDebuff.addEventListener('change', () => { opt.debuff = oDebuff.value; store.set('debuff', opt.debuff); });
oDouble.addEventListener('change', () => { opt.dbl = oDouble.value; store.set('dbl', opt.dbl); });
function closeSheet(){ $('sheet').hidden = true; cv.focus({ preventScroll:true }); }
$('bOpt').addEventListener('click', () => { $('sheet').hidden = false; });
$('bClose').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

// 起動時はギミック選択から
applyTitle();
openMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
