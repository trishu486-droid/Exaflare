<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>混沌の終末トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0b0a14;
  --ink:#f2ecff;
  --dim:#8c83a8;
  --edge:#3a3354;
  --btn:#1d1930;
  --gold:#ffcf4a;
  --red:#ff4d5e;
  --green:#58e07a;
  --ab:#b8385a;
  --px: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--px);padding-inline:16px;padding-block:12px 16px;display:flex;justify-content:center;align-items:flex-start;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}

/* ===== ゲーム機本体 ===== */
.gb{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:6px}
.top h1{margin:0;font:400 14px/1.2 var(--px);letter-spacing:.06em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.top h1 b{color:var(--gold);font-weight:400}
.top h1 span{color:var(--ink)}
.mini{font:13px var(--px);color:var(--ink);background:var(--btn);border:2px solid var(--edge);min-width:36px;height:32px;padding:0 8px;cursor:pointer;touch-action:manipulation}
.mini.on{border-color:var(--green);color:var(--green)}
.screen{position:relative;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}

/* 画面内の表示 */
.outline{text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.cast{position:absolute;left:12%;right:12%;bottom:11%;pointer-events:none}
.cast .bar{height:clamp(8px,2.2vw,12px);border:3px solid #ff9f2a;background:#3a2a55;box-shadow:0 0 0 2px #000}
.cast .fill{height:100%;width:0;background:#fff}
.cast .name{text-align:right;font-size:clamp(16px,5vw,24px);line-height:1.2;margin-top:2px}
.hud{position:absolute;inset:auto 8px 6px 8px;display:flex;justify-content:space-between;pointer-events:none;font-size:clamp(11px,3.2vw,15px);font-variant-numeric:tabular-nums}
.hud .hit{color:var(--red)}
.buff{position:absolute;left:8px;top:6px;font-size:clamp(11px,3.2vw,14px);color:var(--gold);pointer-events:none}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap}
.msg .big{font-size:clamp(26px,9vw,42px);line-height:1.1}
.msg .sub{font-size:clamp(11px,3.2vw,14px);color:var(--ink);margin-top:6px}
.msg .blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;transform:translate(-50%,0);font-size:clamp(13px,4vw,18px);color:#fff;white-space:nowrap;animation:dmg .9s steps(9) forwards;font-variant-numeric:tabular-nums}
.dmg.crit{color:var(--gold);font-size:clamp(16px,5vw,23px)}
@keyframes dmg{0%{opacity:1;margin-top:0}70%{opacity:1}100%{opacity:0;margin-top:-28px}}

/* ===== 操作部 ===== */
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 0}
.stick{position:relative;width:128px;height:128px;flex:none;border:3px solid #15121f;border-radius:50%;background:radial-gradient(circle,#1a1630 0 60%,#120f22 61%);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#3a3354;border:3px solid #6a5f94;box-shadow:inset -4px -4px 0 #2a2440;pointer-events:none}
.ab{display:flex;gap:14px;transform:rotate(-25deg);padding:18px 0 0;margin-right:4px}
.abw{display:flex;flex-direction:column;align-items:center;gap:8px}
.abw.b{margin-top:30px}
.abw span{font-size:11px;color:var(--dim);white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.round{--p:0;width:68px;height:68px;border-radius:50%;font:22px var(--px);color:#fff;cursor:pointer;touch-action:none;border:3px solid #15121f;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.18);
  background:conic-gradient(rgba(0,0,0,.66) calc(var(--p) * 360deg), transparent 0), var(--ab)}
.round.ready{border-color:var(--gold)}
.round.press{transform:translateY(2px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.35)}
.ss{display:flex;justify-content:center;gap:26px;margin-top:8px}
.ssw{display:flex;flex-direction:column;align-items:center;gap:3px;transform:rotate(-25deg)}
.ssw span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.pill{width:58px;height:16px;border-radius:8px;background:#6a6480;border:2px solid #15121f;cursor:pointer;touch-action:manipulation;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.pill:active{transform:translateY(1px)}
.help{margin:0;text-align:center;color:var(--dim);font-size:12px;line-height:1.9}
.help kbd{font:12px var(--px);color:var(--ink);border:2px solid var(--edge);padding:0 4px;background:var(--btn)}
.touch .help{display:none}

/* ===== 設定 ===== */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.panel{width:100%;max-width:380px;background:#131022;border:4px solid var(--edge);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:400 16px var(--px);color:var(--gold)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt select,.opt input[type=range]{font:14px var(--px);color:var(--ink);background:var(--btn);border:2px solid var(--edge);padding:3px 4px;accent-color:var(--gold)}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.panel .note{margin:0;font-size:12px;color:var(--dim);line-height:1.6}
.close{font:14px var(--px);color:var(--gold);background:var(--btn);border:3px solid var(--gold);height:44px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.msg .blink{animation:none}.dmg{animation-duration:.01s}}
</style>
</head>
<body>
<div class="gb" id="game">
  <div class="top">
    <h1><b>混沌の終末</b> <span id="jobName">ナイト</span></h1>
    <button class="mini" id="bSafe" type="button" aria-pressed="false">安置</button>
    <button class="mini" id="bRetry" type="button" aria-label="同じ問題をやり直す">↻</button>
    <button class="mini" id="bOpt" type="button" aria-label="設定">⚙</button>
  </div>

  <div class="screen">
      <canvas id="cv" width="288" height="288" tabindex="0" aria-label="フィールド"></canvas>
      <div class="fx" id="fx"></div>
      <div class="buff outline" id="buff" hidden>迅速魔</div>
      <div class="cast outline" id="cast" hidden><div class="bar"><div class="fill" id="castFill"></div></div><div class="name">混沌の終末</div></div>
      <div class="hud outline"><span id="hSet">SET -/6</span><span id="hDmg">DMG 0</span><span id="hHit">HIT 0</span></div>
      <div class="msg outline" id="msg"></div>
  </div>

  <div class="controls">
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    <div class="ab">
      <div class="abw b"><button class="round" id="btnB" type="button" aria-label="Bボタン">B</button><span id="nameB">ドゥーム</span></div>
      <div class="abw a"><button class="round" id="btnA" type="button" aria-label="Aボタン">A</button><span id="nameA">ロイエ</span></div>
    </div>
  </div>

  <div class="ss">
    <div class="ssw"><button class="pill" id="btnSelect" type="button" aria-label="SELECT：ジョブ変更"></button><span>SELECT</span></div>
    <div class="ssw"><button class="pill" id="btnStart" type="button" aria-label="START：開始"></button><span>START</span></div>
  </div>

  <p class="help"><kbd>WASD</kbd> 移動　<kbd>J</kbd> A　<kbd>K</kbd> B　<kbd>Enter</kbd> START　<kbd>Shift</kbd> SELECT<br><kbd>Space</kbd> 安置表示　<kbd>R</kbd> リトライ</p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <label class="opt"><span>最初の方向</span>
      <select id="oFirst"><option value="rand">ランダム</option><option value="NW">北西</option><option value="NE">北東</option></select></label>
    <label class="opt"><span>ゲーム速度 <span id="oSpeedV">100%</span></span>
      <input type="range" id="oSpeed" min="0.4" max="1" step="0.1" value="1"></label>
    <label class="opt"><span>エクサの進路を表示</span><input type="checkbox" id="oPath"></label>
    <label class="opt"><span>4点避けの位置を表示</span><input type="checkbox" id="oSpots"></label>
    <label class="opt"><span>マーカー</span>
      <select id="oMarker"><option value="nw">1=北西</option><option value="ne">1=北東</option></select></label>
    <label class="opt"><span>効果音</span><input type="checkbox" id="oSound" checked></label>
    <p class="note">6レーン中2本が光り、北西・北東から2.5秒ごとに交互に計6セット。予兆の4.6秒後から0.51秒間隔で6発、着弾円は半径6y。座標とタイミングは cactbot / Splatoon のデータから算出。</p>
    <button class="close" id="bClose" type="button">とじる</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ===== ギミック定数（docs/research-stray-apocalypse.md） =====
const ARENA_R = 20, EXA_R = 6, HIT_COUNT = 6;
const SET_INTERVAL = 2.5, FIRST_HIT = 4.6, HIT_GAP = 0.51;
const PLAYER_SPEED = 6, COUNTDOWN = 3;
const PATTERNS = { A: [-25, 5], B: [-15, 15], C: [-5, 25] }; // レーン i と i+3

// ===== ジョブ =====
// pot は見た目のダメージ用（実数値ではない）
const JOBS = {
  pld: { name:'ナイト',   role:'tank',   melee:true,
         a:{ name:'ロイエ', pot:460 },
         b:{ name:'ドゥーム', pot:140 } },
  mch: { name:'機工士',   role:'dps',    melee:false,
         a:{ name:'ドリル', pot:600 },
         b:{ name:'チェックメイト', pot:170 } },
  blm: { name:'黒魔道士', role:'dps',    melee:false,
         a:{ name:'ファイジャ', pot:320, cast:2.0 },
         b:{ name:'迅速魔', swift:true } },
};
const JOB_ORDER = ['pld', 'mch', 'blm'];
const GCD = 2.5, QUEUE = 0.5, MELEE = 3, ABILITY_CD = 10, SLIDECAST = 0.5;

// ===== 画面（内部 288px、1y = 4px） =====
const W = 288, PPY = 4, C0 = W / 2; // 描画範囲 ±36y（場外の予兆まで見える）
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const px = x => Math.round(C0 + x * PPY);

// 8bitパレット
const P = {
  void:'#000000', floor:'#4b4c8a', grid:'#3e3f7a', diag:'#3a3a70', rim:'#4c6ed8', rim2:'#2d3f8f',
  exa:'#ff7a1f', exaDk:'#3a1606', exaHi:'#ffe08a', chev:'#fff4d6', white:'#ffffff',
  safe:'#58e07a', boss:'#b04a8a', bossEdge:'#d8609c', bossTip:'#ff5aa8', hurt:'#ff2a3a',
  mk:['#ff5a5a','#ffd84a','#5ad0ff','#d08cff']
};

// ===== 設定（保存に失敗しても動く） =====
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('exa-kefka:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('exa-kefka:' + k, JSON.stringify(v)); } catch {} }
};
const opt = {
  first: store.get('first', 'rand'), speed: store.get('speed', 1), path: store.get('path', false),
  spots: store.get('spots', false), marker: store.get('marker', 'nw'), sound: store.get('sound', true),
  safe: store.get('safe', false), job: store.get('job', 'pld')
};
if (!JOBS[opt.job]) opt.job = 'pld';
const job = () => JOBS[opt.job];

// ===== 状態 =====
const S = { phase:'title', t:-COUNTDOWN, sets:[], player:{x:0,z:5}, hits:0, hurtT:-9 };
const keys = new Set();
const stickVec = { x:0, z:0 };

// ===== 問題 =====
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeProblem(){
  const first = opt.first === 'rand' ? (Math.random() < .5 ? 'NW' : 'NE') : opt.first;
  const second = first === 'NW' ? 'NE' : 'NW';
  const p1 = shuffle(['A','B','C']), p2 = shuffle(['A','B','C']), list = [];
  for (let i = 0; i < 3; i++){ list.push({ dir:first, pat:p1[i] }); list.push({ dir:second, pat:p2[i] }); }
  return list;
}
// ローカル座標（x=東, z=南）
function laneHit(dir, off, k){
  if (dir === 'NW'){ const s = -35 + 10 * k; return { x:(s + off) / 2, z:(s - off) / 2 }; }
  const d = 35 - 10 * k; return { x:(off + d) / 2, z:(off - d) / 2 };
}
function buildSets(list){
  return list.map((w, k) => {
    const start = SET_INTERVAL * k;
    const lanes = PATTERNS[w.pat].map(off => ({
      spawn: laneHit(w.dir, off, 0),
      hits: Array.from({ length:HIT_COUNT }, (_, i) => {
        const p = laneHit(w.dir, off, i + 1);
        return { t:start + FIRST_HIT + HIT_GAP * i, x:p.x, z:p.z, done:false };
      })
    }));
    return { ...w, start, lanes };
  });
}
let problem = makeProblem();
const END_T = SET_INTERVAL * 5 + FIRST_HIT + HIT_GAP * (HIT_COUNT - 1);

function begin(same){
  if (!same) problem = makeProblem();
  S.sets = buildSets(problem);
  S.t = -COUNTDOWN; S.phase = 'count'; S.hits = 0; S.hurtT = -9; actReset();
  S.player = { x:0, z:5 };
  sfx.unlock(); sfx.blip(660, .08);
  cv.focus({ preventScroll:true });
}

// ===== 効果音（8bit矩形波） =====
const sfx = {
  ac:null,
  unlock(){ if (!opt.sound) return; try { this.ac ||= new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); } catch {} },
  tone(freq, dur, type = 'square', vol = .06, slide = 0){
    if (!opt.sound || !this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + .02);
  },
  blip(f, d){ this.tone(f, d); },
  boom(){ this.tone(140, .09, 'square', .025, -80); },
  hurt(){ this.tone(220, .25, 'sawtooth', .08, -160); },
  hit(){ this.tone(988, .05, 'square', .04); },
  crit(){ this.tone(1318, .08, 'square', .045); },
  no(){ this.tone(160, .12, 'square', .05); },
  buff(){ [660, 880].forEach((f, i) => setTimeout(() => this.tone(f, .06, 'triangle', .06), i * 60)); },
  clear(){ [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, .12), i * 110)); },
  fail(){ [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, .16), i * 150)); }
};

// ===== ドット描画 =====
function rect(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function disc(cx, cy, r, c){
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++){ const hw = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
// 円の縁（ブレゼンハム）
function ring(cx, cy, r, c){
  ctx.fillStyle = c;
  let x = r, y = 0, e = 1 - r;
  while (x >= y){
    [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]].forEach(([a, b]) => ctx.fillRect(cx + a, cy + b, 1, 1));
    y++;
    if (e < 0) e += 2 * y + 1; else { x--; e += 2 * (y - x) + 1; }
  }
}
function line(x0, y0, x1, y1, c){
  ctx.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;){ ctx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy){ e += dy; x0 += sx; } if (e2 <= dx){ e += dx; y0 += sy; } }
}
function sprite(rows, cx, cy, pal){
  const h = rows.length, w = rows[0].length, ox = cx - (w >> 1), oy = cy - (h >> 1);
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') rect(ox + i, oy + j, 1, 1, pal[ch]); }));
}
// 3x5 ドット数字・英字（マーカー用）
const GLYPH = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  1:'010110010010111', 2:'110001010100111', 3:'110001010001110', 4:'101101111001001'
};
function glyph(ch, cx, cy, c){
  const g = GLYPH[ch]; if (!g) return;
  for (let i = 0; i < 15; i++) if (g[i] === '1') rect(cx - 1 + (i % 3), cy - 2 + (i / 3 | 0), 1, 1, c);
}
function alpha(a, fn){ ctx.globalAlpha = a; fn(); ctx.globalAlpha = 1; }
function thickRing(cx, cy, r, c, w){ for (let i = 0; i < w; i++) ring(cx, cy, r - i, c); }

// 自キャラ：ジョブアイコン（タンク=青、DPS=赤の枠付きタイル）
const ICON = {
  pld: [ // 剣
    '.........',
    '......xx.',
    '.....xxx.',
    '..x.xxx..',
    '...xxx...',
    '...xx....',
    '..x..x...',
    '.x.......',
    '.........'],
  mch: [ // 銃
    '.........',
    '.........',
    '.xxxxxxx.',
    '.xxxxxxx.',
    '.xx.x....',
    '.xx......',
    '.xx......',
    '.........',
    '.........'],
  blm: [ // とんがり帽子
    '.....x...',
    '....xx...',
    '...xxx...',
    '...xxxx..',
    '..xxxxx..',
    '..xxxxxx.',
    'xxxxxxxxx',
    '.........',
    '.........'],
};
const ROLE_COLOR = { tank:'#3a6ad8', dps:'#d8404e' };
function drawIcon(X, Z, hurt){
  const bg = hurt ? '#ff2a3a' : ROLE_COLOR[job().role], fg = hurt ? '#ffe066' : '#ffffff';
  rect(X - 5, Z - 5, 11, 11, '#ffffff');
  rect(X - 4, Z - 4, 9, 9, bg);
  ICON[opt.job].forEach((row, j) => [...row].forEach((ch, i) => { if (ch === 'x') rect(X - 4 + i, Z - 4 + j, 1, 1, fg); }));
}

function drawField(){
  rect(0, 0, W, W, P.void);
  const R = ARENA_R * PPY;
  disc(C0, C0, R, P.floor);
  // 床の模様：2yグリッド + 大きな斜め線
  ctx.fillStyle = P.grid;
  for (let y = -R; y <= R; y++){
    const hw = Math.floor(Math.sqrt(R * R - y * y));
    if ((y & 7) === 0) ctx.fillRect(C0 - hw, C0 + y, hw * 2 + 1, 1);
    for (let x = -hw; x <= hw; x++){
      if ((x & 7) === 0) ctx.fillRect(C0 + x, C0 + y, 1, 1);
      else if (((x + y) % 40 + 40) % 40 === 0 || ((x - y) % 40 + 40) % 40 === 0){ ctx.fillStyle = P.diag; ctx.fillRect(C0 + x, C0 + y, 1, 1); ctx.fillStyle = P.grid; }
    }
  }
  thickRing(C0, C0, R + 3, P.rim, 3);
  ring(C0, C0, R + 4, P.rim2);
  // フィールドマーカー
  const m = 16, d = Math.round(m / Math.SQRT2);
  [['A',0,-m],['B',m,0],['C',0,m],['D',-m,0]].forEach(([t, x, z], i) => {
    alpha(.35, () => disc(px(x), px(z), 5, P.mk[i])); ring(px(x), px(z), 5, P.mk[i]); glyph(t, px(x), px(z), P.white);
  });
  const corners = opt.marker === 'nw' ? [[-d,-d],[d,-d],[d,d],[-d,d]] : [[d,-d],[d,d],[-d,d],[-d,-d]];
  corners.forEach(([x, z], i) => {
    const X = px(x), Z = px(z), c = P.mk[i];
    alpha(.35, () => rect(X - 5, Z - 5, 11, 11, c));
    line(X - 5, Z - 5, X + 5, Z - 5, c); line(X + 5, Z - 5, X + 5, Z + 5, c); line(X + 5, Z + 5, X - 5, Z + 5, c); line(X - 5, Z + 5, X - 5, Z - 5, c);
    glyph(String(i + 1), X, Z, P.white);
  });
}

// ボス：塗りつぶしのターゲットサークル + 正面の三角（北向き）
const BOSS_R = 6;
function drawBoss(){
  const R = BOSS_R * PPY;
  alpha(.6, () => disc(C0, C0, R, P.boss));
  ring(C0, C0, R, P.bossEdge);
  alpha(.5, () => ring(C0, C0, R - 6, P.bossEdge));
  for (let i = 0; i < 5; i++) line(C0 - i, C0 - R - 4 + i, C0 + i, C0 - R - 4 + i, P.bossTip);
  if (performance.now() - A.bossFlash < 90) alpha(.5, () => disc(C0, C0, R, P.white)); // 被ダメの白フラッシュ
}

function drawSpots(){
  if (!opt.spots) return;
  [[0,-5],[5,0],[0,5],[-5,0]].forEach(([x, z]) => { ring(px(x), px(z), 3, P.white); rect(px(x), px(z), 1, 1, P.white); });
}

function drawSafe(){
  if (!opt.safe || S.phase !== 'run') return;
  const pending = [];
  S.sets.forEach(s => { if (S.t >= s.start) s.lanes.forEach(l => l.hits.forEach(h => { if (!h.done) pending.push(h); })); });
  if (!pending.length) return;
  const r2 = EXA_R * EXA_R, R2 = ARENA_R * ARENA_R;
  ctx.globalAlpha = .45; ctx.fillStyle = P.safe;
  for (let y = 0; y < W; y += 2) for (let x = 0; x < W; x += 2){
    const wx = (x - C0 + 1) / PPY, wz = (y - C0 + 1) / PPY;
    if (wx * wx + wz * wz > R2) continue;
    let ok = true;
    for (const h of pending){ const dx = wx - h.x, dz = wz - h.z; if (dx * dx + dz * dz <= r2){ ok = false; break; } }
    if (ok) ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
}

// 2px太さのL字（斜め方向の山形矢印）
function corner(cx, cz, sx, sz, L, c){
  rect(Math.min(cx, cx - sx * (L - 1)), sz > 0 ? cz - 1 : cz, L, 2, c);
  rect(sx > 0 ? cx - 1 : cx, Math.min(cz, cz - sz * (L - 1)), 2, L, c);
}
// エクサの予兆マーク（実機に合わせて：オレンジの円 + 進行方向の白い「>>>」）
function exaMark(X, Z, sx, sz, on){
  const R = EXA_R * PPY;
  alpha(.35, () => disc(X, Z, R, P.exa));
  thickRing(X, Z, R, on ? P.exa : '#c9561a', 2);
  [[-7, '#c98a5a'], [1, '#ffd9a8'], [9, P.chev]].forEach(([o, c]) => corner(X + sx * o, Z + sz * o, sx, sz, 10, c));
}

function drawExas(){
  const t = S.t, blink = (Math.floor(performance.now() / 150) & 1) === 0;
  S.sets.forEach(s => {
    if (t < s.start) return;
    const tt = t - s.start;
    s.lanes.forEach(l => {
      const h1 = l.hits[0], h2 = l.hits[1];
      const sx = Math.sign(h2.x - h1.x), sz = Math.sign(h2.z - h1.z);
      if (opt.path && !l.hits[HIT_COUNT - 1].done) l.hits.forEach(h => { if (!h.done) ring(px(h.x), px(h.z), EXA_R * PPY, '#8a7ad0'); });
      // 予兆は場外の発生地点に出る（実機スクショで確認）
      if (tt < FIRST_HIT) exaMark(px(l.spawn.x), px(l.spawn.z), sx, sz, blink);
      l.hits.forEach(h => {
        const dt = t - h.t;
        if (dt < 0 || dt > .4) return;
        const X = px(h.x), Z = px(h.z), R = EXA_R * PPY, k = dt / .4;
        if (k < .3){ alpha(.85, () => disc(X, Z, R, P.exa)); disc(X, Z, Math.round(R * .55), P.exaHi); disc(X, Z, Math.round(R * .2), P.white); }
        else { alpha(.5 * (1 - k), () => disc(X, Z, R, P.exa)); ring(X, Z, Math.round(R * (.55 + k * .45)), P.exaHi); }
      });
    });
  });
}

function drawActFx(){
  const now = performance.now(), X = px(S.player.x), Z = px(S.player.z);
  if (job().melee) alpha(.45, () => ring(C0, C0, (BOSS_R + MELEE) * PPY, '#c9a2ff'));
  if (now - A.failT < 500){ // 射程外・詠唱中断
    line(X - 3, Z - 14, X + 3, Z - 8, P.hurt); line(X + 3, Z - 14, X - 3, Z - 8, P.hurt);
    line(X - 2, Z - 14, X + 4, Z - 8, P.hurt); line(X + 4, Z - 14, X - 2, Z - 8, P.hurt);
  }
  if (A.cast){ // 詠唱バー（キャラの下）
    const k = Math.min(1, (S.t - A.cast.start) / (A.cast.end - A.cast.start));
    rect(X - 11, Z + 8, 22, 5, '#000000'); rect(X - 10, Z + 9, 20, 3, '#3a2a55'); rect(X - 10, Z + 9, Math.round(20 * k), 3, '#ffffff');
  }
}

function drawPlayer(){
  const now = performance.now(), hurt = now - S.hurtT < 500;
  drawIcon(px(S.player.x), px(S.player.z), hurt && (Math.floor(now / 70) & 1));
}

// 詠唱バー（Stray Apocalypse は1セット目の予兆と同時に詠唱、約3.9秒）
const CAST_LEN = 3.9;
const castEl = $('cast'), castFill = $('castFill');
function drawCast(){
  const on = (S.phase === 'run') && S.t >= 0 && S.t < CAST_LEN;
  castEl.hidden = !on;
  if (on) castFill.style.width = (S.t / CAST_LEN * 100).toFixed(1) + '%';
}

function draw(){
  drawField(); drawSafe(); drawSpots(); drawBoss(); drawExas(); drawActFx(); drawPlayer(); drawCast();
}

// ===== アクション（A=GCD / B=アビリティ） =====
const A = { readyAt:0, queued:false, cast:null, abilityAt:0, swift:false, gcds:0, dmg:0, loss:0, failT:-9, bossFlash:-9 };
function actReset(){ Object.assign(A, { readyAt:0, queued:false, cast:null, abilityAt:0, swift:false, gcds:0, dmg:0, loss:0, failT:-9 }); fxEl.innerHTML = ''; }
function inRange(){ return !job().melee || Math.hypot(S.player.x, S.player.z) <= BOSS_R + MELEE; }
function isMoving(){ return keys.size > 0 || stickVec.x !== 0 || stickVec.z !== 0; }

const fxEl = $('fx');
function popup(text, cls){
  const el = document.createElement('div');
  el.className = 'dmg outline ' + (cls || '');
  el.textContent = text;
  el.style.left = (50 + (Math.random() * 16 - 8)) + '%';
  el.style.top = (37 + Math.random() * 4) + '%';
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function dealDamage(pot){
  const crit = Math.random() < .25;
  const dmg = Math.round(pot * 58 * (.95 + Math.random() * .1) * (crit ? 1.5 : 1));
  A.dmg += dmg; A.bossFlash = performance.now();
  popup(dmg.toLocaleString('en-US') + (crit ? '!' : ''), crit ? 'crit' : '');
  crit ? sfx.crit() : sfx.hit();
}
function fail(){ A.failT = performance.now(); sfx.no(); }

function pressA(){
  sfx.unlock();
  if (S.phase === 'run' && !A.cast && S.t >= A.readyAt - QUEUE) A.queued = true;
}
function pressB(){
  sfx.unlock();
  if (S.phase !== 'run' || S.t < A.abilityAt) return;
  if (A.cast){ fail(); return; }
  const b = job().b;
  if (b.swift){ A.swift = true; A.abilityAt = S.t + ABILITY_CD; sfx.buff(); popup('迅速魔', 'crit'); return; }
  if (!inRange()){ fail(); return; }
  A.abilityAt = S.t + ABILITY_CD; dealDamage(b.pot);
}
function actTick(dt){
  const a = job().a;
  // 詠唱中：スライドキャスト猶予前に動くと中断（GCDは戻る）
  if (A.cast){
    if (isMoving() && S.t < A.cast.end - SLIDECAST){ A.cast = null; A.readyAt = S.t; fail(); }
    else if (S.t >= A.cast.end){ A.cast = null; dealDamage(a.pot); }
    return;
  }
  if (S.t < A.readyAt) return;
  if (A.queued){
    A.queued = false;
    if (!inRange()){ fail(); }
    else {
      A.readyAt = S.t + GCD; A.gcds++;
      if (a.cast && !A.swift) A.cast = { start:S.t, end:S.t + a.cast };
      else { if (a.cast) A.swift = false; dealDamage(a.pot); }
      return;
    }
  }
  if (S.t <= END_T) A.loss += dt; // 撃てるのに撃っていない時間
}

const btnA = $('btnA'), btnB = $('btnB'), buffEl = $('buff');
function drawButtons(){
  const run = S.phase === 'run';
  const pa = run ? Math.max(0, Math.min(1, (A.readyAt - S.t) / GCD)) : 0;
  const rb = run ? Math.max(0, A.abilityAt - S.t) : 0;
  btnA.style.setProperty('--p', pa.toFixed(3));
  btnA.classList.toggle('ready', run && pa === 0 && !A.cast);
  btnB.style.setProperty('--p', (rb / ABILITY_CD).toFixed(3));
  btnB.classList.toggle('ready', run && rb === 0);
  const bl = rb > 0 ? String(Math.ceil(rb)) : 'B';
  if (btnB.textContent !== bl) btnB.textContent = bl;
  buffEl.hidden = !A.swift;
}

// ===== HUD / メッセージ =====
const hSet = $('hSet'), hHit = $('hHit'), hDmg = $('hDmg'), msg = $('msg');
let lastMsg = '';
function setMsg(html){ if (html !== lastMsg){ msg.innerHTML = html; lastMsg = html; } }
const DIR8 = ['北','北東','東','南東','南','南西','西','北西'];
function patName(s){
  if (s.pat === 'B') return '中';
  const base = s.dir === 'NW' ? (s.pat === 'A' ? 5 : 1) : (s.pat === 'A' ? 7 : 3);
  return DIR8[base] + '端';
}
function dirName(s){ return s.dir === 'NW' ? '北西' : '北東'; }
function updateHud(){
  const n = S.phase === 'run' || S.phase === 'done' ? S.sets.filter(s => S.t >= s.start).length : 0;
  hSet.textContent = `SET ${n || '-'}/6`;
  hHit.textContent = `HIT ${S.hits}`; hHit.className = S.hits ? 'hit' : '';
  hDmg.textContent = `DMG ${A.dmg.toLocaleString('en-US')}`;
  if (S.phase === 'title') setMsg(`<div class="big">EXAFLARE</div><div class="sub">${job().name}</div><div class="sub blink">STARTで開始 ／ SELECTでジョブ変更</div>`);
  else if (S.phase === 'count') setMsg(`<div class="big">${Math.ceil(-S.t)}</div>`);
  else if (S.phase === 'done'){
    const ok = S.hits === 0;
    const order = S.sets.map(s => `${dirName(s)}${patName(s)}`).join(' → ');
    setMsg(`<div class="big" style="color:${ok ? 'var(--green)' : 'var(--red)'}">${ok ? 'CLEAR!' : 'HIT ' + S.hits}</div>` +
      `<div class="sub">${job().name}　${A.dmg.toLocaleString('en-US')} DMG</div>` +
      `<div class="sub">GCD ${A.gcds}回 ／ ロス ${A.loss.toFixed(1)}秒</div>` +
      `<div class="sub">${order}</div><div class="sub blink">START：次の問題　↻：リトライ</div>`);
  } else setMsg('');
}
function applyJob(){
  const j = job();
  $('jobName').textContent = j.name;
  $('nameA').textContent = j.a.name;
  $('nameB').textContent = j.b.name;
}
function selectJob(){
  if (S.phase === 'count' || S.phase === 'run') return;
  opt.job = JOB_ORDER[(JOB_ORDER.indexOf(opt.job) + 1) % JOB_ORDER.length];
  store.set('job', opt.job); applyJob(); lastMsg = '';
  sfx.unlock(); sfx.blip(520, .05);
}

// ===== 更新 =====
function movePlayer(dt){
  let mx = stickVec.x, mz = stickVec.z;
  if (keys.has('w')) mz -= 1; if (keys.has('s')) mz += 1;
  if (keys.has('a')) mx -= 1; if (keys.has('d')) mx += 1;
  const len = Math.hypot(mx, mz); if (!len) return;
  let x = S.player.x + mx / len * PLAYER_SPEED * dt, z = S.player.z + mz / len * PLAYER_SPEED * dt;
  const r = Math.hypot(x, z); if (r > ARENA_R - .5){ x *= (ARENA_R - .5) / r; z *= (ARENA_R - .5) / r; }
  S.player.x = x; S.player.z = z;
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000) * opt.speed; last = now;
  movePlayer(dt);
  if (S.phase === 'count' || S.phase === 'run'){
    const before = S.t;
    S.t += dt;
    if (S.phase === 'count'){
      if (Math.ceil(-before) !== Math.ceil(-S.t) && S.t < 0) sfx.blip(660, .08);
      if (S.t >= 0){ S.phase = 'run'; sfx.blip(990, .15); }
    }
    if (S.phase === 'run'){
      let boom = false;
      S.sets.forEach(s => s.lanes.forEach(l => l.hits.forEach(h => {
        if (h.done || S.t < h.t) return;
        h.done = true; boom = true;
        const dx = S.player.x - h.x, dz = S.player.z - h.z;
        if (dx * dx + dz * dz <= EXA_R * EXA_R){ S.hits++; S.hurtT = now; sfx.hurt(); }
      })));
      if (boom) sfx.boom();
      actTick(dt);
      if (S.t > END_T + .6){ S.phase = 'done'; A.cast = null; S.hits ? sfx.fail() : sfx.clear(); }
    }
  }
  draw(); updateHud(); drawButtons();
  requestAnimationFrame(frame);
}

// ===== 入力：キーボード =====
const KEYMAP = { w:'w', arrowup:'w', s:'s', arrowdown:'s', a:'a', arrowleft:'a', d:'d', arrowright:'d' };
function toggleSafe(){ opt.safe = !opt.safe; store.set('safe', opt.safe); syncSafe(); }
function syncSafe(){ const b = $('bSafe'); b.classList.toggle('on', opt.safe); b.setAttribute('aria-pressed', String(opt.safe)); }
window.addEventListener('keydown', e => {
  if (!$('sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
  const k = e.key.toLowerCase();
  if (KEYMAP[k]){ keys.add(KEYMAP[k]); e.preventDefault(); return; }
  if (e.repeat) return;
  if (k === 'j' || k === '1'){ pressA(); e.preventDefault(); }
  else if (k === 'k' || k === '2'){ pressB(); e.preventDefault(); }
  else if (k === 'enter'){ begin(false); e.preventDefault(); }
  else if (k === 'shift') selectJob();
  else if (k === ' '){ toggleSafe(); e.preventDefault(); }
  else if (k === 'r') begin(true);
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.key.toLowerCase()]; if (k) keys.delete(k); });
window.addEventListener('blur', () => { keys.clear(); stickVec.x = stickVec.z = 0; });

// ===== 入力：タッチ・マウス（スティックとボタンは同時に操作できる） =====
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
window.addEventListener('touchstart', () => document.body.classList.add('touch'), { once:true, passive:true });

const stick = $('stick'), knob = $('knob');
let stickId = null;
function stickMove(e){
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dz = e.clientY - (r.top + R);
  const d = Math.hypot(dx, dz), max = R - 20;
  if (d > max){ dx *= max / d; dz *= max / d; }
  knob.style.transform = `translate(${dx}px,${dz}px)`;
  const n = Math.hypot(dx, dz) / max;
  if (n < .2){ stickVec.x = stickVec.z = 0; } else { stickVec.x = dx / Math.hypot(dx, dz); stickVec.z = dz / Math.hypot(dx, dz); }
}
function stickEnd(){ stickId = null; stickVec.x = stickVec.z = 0; knob.style.transform = ''; }
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); e.preventDefault(); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
stick.addEventListener('pointerup', stickEnd);
stick.addEventListener('pointercancel', stickEnd);

// 画面をドラッグしても移動できる
let dragId = null, dragO = null;
cv.addEventListener('pointerdown', e => { dragId = e.pointerId; dragO = { x:e.clientX, y:e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const dx = e.clientX - dragO.x, dz = e.clientY - dragO.y, d = Math.hypot(dx, dz);
  if (d < 10){ stickVec.x = stickVec.z = 0; return; }
  stickVec.x = dx / d; stickVec.z = dz / d;
  if (d > 60){ dragO.x = e.clientX - dx / d * 60; dragO.y = e.clientY - dz / d * 60; }
});
['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, e => { if (e.pointerId === dragId){ dragId = null; stickVec.x = stickVec.z = 0; } }));

// A/B は押した瞬間に反応させる
function holdButton(el, fn){
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('press'); fn(); });
  ['pointerup','pointercancel','pointerleave'].forEach(t => el.addEventListener(t, () => el.classList.remove('press')));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
holdButton(btnA, pressA);
holdButton(btnB, pressB);
$('btnStart').addEventListener('click', () => begin(false));
$('btnSelect').addEventListener('click', selectJob);
$('bRetry').addEventListener('click', () => begin(true));
$('bSafe').addEventListener('click', toggleSafe);
syncSafe();

// ===== 設定シート =====
const oFirst = $('oFirst'), oSpeed = $('oSpeed'), oPath = $('oPath'), oSpots = $('oSpots'), oMarker = $('oMarker'), oSound = $('oSound');
oFirst.value = opt.first; oSpeed.value = opt.speed; oPath.checked = opt.path; oSpots.checked = opt.spots; oMarker.value = opt.marker; oSound.checked = opt.sound;
function speedLabel(){ $('oSpeedV').textContent = Math.round(opt.speed * 100) + '%'; }
speedLabel();
oFirst.addEventListener('change', () => { opt.first = oFirst.value; store.set('first', opt.first); });
oSpeed.addEventListener('input', () => { opt.speed = parseFloat(oSpeed.value); store.set('speed', opt.speed); speedLabel(); });
oPath.addEventListener('change', () => { opt.path = oPath.checked; store.set('path', opt.path); });
oSpots.addEventListener('change', () => { opt.spots = oSpots.checked; store.set('spots', opt.spots); });
oMarker.addEventListener('change', () => { opt.marker = oMarker.value; store.set('marker', opt.marker); });
oSound.addEventListener('change', () => { opt.sound = oSound.checked; store.set('sound', opt.sound); if (opt.sound) sfx.unlock(); });
function closeSheet(){ $('sheet').hidden = true; cv.focus({ preventScroll:true }); }
$('bOpt').addEventListener('click', () => { $('sheet').hidden = false; });
$('bClose').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

// 初期表示
applyJob();
S.sets = buildSets(problem); S.sets.forEach(s => s.lanes.forEach(l => l.hits.forEach(h => h.done = true)));
requestAnimationFrame(frame);
})();
</script>
</body>
